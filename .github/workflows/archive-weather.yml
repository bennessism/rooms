name: Archive Window weather history

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

jobs:
  archive-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archive latest Window weather cache
        run: python scripts/archive_weather.py

      - name: Commit new history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-history
          if git diff --cached --quiet; then
            echo "No new weather snapshot to archive."
            exit 0
          fi
          git commit -m "Archive weather history"
          git push
