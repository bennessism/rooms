<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),scroller=document.getElementById('scroller');
const summaryBtn=document.getElementById('summaryBtn'),summaryLine=document.getElementById('summaryLine'),detailCard=document.getElementById('detailCard'),detailLoc=document.getElementById('detailLoc'),conditionEl=document.getElementById('condition'),speedEl=document.getElementById('speed'),gustEl=document.getElementById('gust'),fromText=document.getElementById('fromText'),directionEl=document.getElementById('direction'),updatedEl=document.getElementById('updated');
const picker=document.getElementById('picker'),countrySelect=document.getElementById('countrySelect'),locationSelect=document.getElementById('locationSelect');
let wind=12,gust=18,windDir=250,isDay=true,particles=[],leafParticles=[],stars=[],kites=[],clouds=[],catalog=null,currentLat=3.0738,currentLon=101.5183,currentPlace='Selangor · Shah Alam',currentArea='Selangor';
const DPR=()=>Math.min(devicePixelRatio||1,2);
function resize(){const r=stage.getBoundingClientRect(),d=DPR();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);seedScene(r.width,r.height)}
function seedScene(w,h){stars=Array.from({length:95},()=>({x:Math.random()*w,y:Math.random()*h*.46,r:.35+Math.random()*1.15,a:.28+Math.random()*.72}));clouds=Array.from({length:7},(_,i)=>({x:(i/7)*w+Math.random()*230,y:36+Math.random()*Math.max(85,h*.15),s:.62+Math.random()*1.2,p:Math.random()*6.28}));kites=[{x:.57,y:.30,c:'#ff5b67',p:0},{x:.72,y:.23,c:'#ffd54a',p:2.1},{x:.85,y:.34,c:'#4ad1c8',p:4.2}];particles=[];leafParticles=[]}
function compassName(deg){const n=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return n[Math.round((deg%360)/22.5)%16]}
function windStrength(v){if(v<5)return'Calm';if(v<20)return'Light breeze';if(v<39)return'Moderate breeze';if(v<62)return'Strong breeze';if(v<89)return'Gale';return'Storm-force wind'}
function downwindVector(){const a=(windDir+180)*Math.PI/180;return{x:Math.sin(a),y:-Math.cos(a)}}
function drawSky(w,h){const c=isDay?['#6fb4e8','#d9efff','#f3d6a4']:['#06101d','#132640','#263a53'],g=ctx.createLinearGradient(0,0,0,h*.72);g.addColorStop(0,c[0]);g.addColorStop(.66,c[1]);g.addColorStop(1,c[2]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(!isDay){ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#f5efcf';ctx.beginPath();ctx.arc(w*.82,h*.145,27,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#fff8c6';ctx.globalAlpha=.82;ctx.beginPath();ctx.arc(w*.84,h*.13,34,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function cloudPos(c,w,h,t){const d=downwindVector(),speed=Math.max(3.2,wind*.16),dx=t*speed*.003*d.x,band=Math.max(85,h*.15);return{x:((c.x+dx)%(w+360)+w+360)%(w+360)-180,y:36+((c.y-36+Math.sin(t*.00018+c.p)*5)%band+band)%band}}
function fillCloudEllipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawClouds(w,h,t){ctx.fillStyle=isDay?'#ffffff':'#aebdcc';for(const c of clouds){const p=cloudPos(c,w,h,t),x=p.x,y=p.y,s=c.s;fillCloudEllipse(x,y,74*s,24*s);fillCloudEllipse(x-47*s,y-6*s,42*s,24*s);fillCloudEllipse(x-10*s,y-18*s,38*s,28*s);fillCloudEllipse(x+30*s,y-14*s,44*s,30*s);fillCloudEllipse(x+58*s,y-3*s,33*s,22*s)}}
function drawField(w,h){const horizon=h*.60,g=ctx.createLinearGradient(0,horizon,0,h);g.addColorStop(0,isDay?'#6f9f52':'#27422d');g.addColorStop(.58,isDay?'#517940':'#1b3022');g.addColorStop(1,isDay?'#335636':'#0e1b15');ctx.fillStyle=g;ctx.fillRect(0,horizon,w,h-horizon);ctx.fillStyle=isDay?'#5f8b48':'#213827';ctx.beginPath();ctx.moveTo(0,horizon+14);for(let x=0;x<=w;x+=80)ctx.lineTo(x,horizon-8-Math.sin(x*.008)*12-Math.sin(x*.021)*4);ctx.lineTo(w,horizon+26);ctx.lineTo(0,horizon+26);ctx.fill()}
function drawWindow(x,y,w,h,s){ctx.fillStyle=isDay?'#dbeeff':'#f6d789';ctx.fillRect(x,y,w,h);ctx.strokeStyle=isDay?'#6e6a64':'#80683d';ctx.lineWidth=2*s;ctx.strokeRect(x,y,w,h);ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke();ctx.fillStyle=isDay?'#f4f0e9':'#82715c';ctx.fillRect(x-4*s,y-5*s,w+8*s,5*s)}
function roofPoly(points,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function drawFarmhouse(w,h,t){const ground=h*.77,s=Math.max(.82,Math.min(1.30,w/1160)),left=Math.max(12,w*.035),baseW=500*s,baseH=158*s,top=ground-baseH,roof=isDay?'#62584f':'#292521',wall=isDay?'#eee9df':'#686159',trim=isDay?'#f7f4ed':'#847b70',shadow=isDay?'#b8afa4':'#443f3a';
ctx.save();drawPropertyFence(w,h,left,baseW,ground,s,'back');
ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(left+baseW*.52,ground+12*s,baseW*.52,22*s,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=wall;ctx.fillRect(left,top,baseW,baseH);ctx.fillStyle=shadow;ctx.fillRect(left+baseW*.72,top+21*s,baseW*.28,baseH-21*s);
roofPoly([[left-22*s,top+8*s],[left+150*s,top-112*s],[left+330*s,top+8*s]],roof);roofPoly([[left+228*s,top+8*s],[left+355*s,top-78*s],[left+520*s,top+8*s]],isDay?'#595149':'#24211e');
ctx.fillStyle=wall;ctx.fillRect(left+96*s,top-18*s,120*s,65*s);roofPoly([[left+82*s,top-16*s],[left+156*s,top-72*s],[left+230*s,top-16*s]],roof);
ctx.fillStyle=wall;ctx.fillRect(left+286*s,top-4*s,112*s,72*s);roofPoly([[left+270*s,top-2*s],[left+342*s,top-63*s],[left+414*s,top-2*s]],isDay?'#6d6257':'#2d2925');
ctx.fillStyle=trim;ctx.fillRect(left,top+6*s,baseW,5*s);ctx.fillRect(left+5*s,ground-8*s,baseW-10*s,8*s);
const chimneyX=left+92*s;ctx.fillStyle=isDay?'#786655':'#39312a';ctx.fillRect(chimneyX,top-86*s,28*s,96*s);ctx.fillStyle=isDay?'#5b4b3f':'#241f1b';ctx.fillRect(chimneyX-4*s,top-92*s,36*s,9*s);
for(const p of [[left+42*s,top+40*s,52*s,42*s],[left+121*s,top+3*s,40*s,36*s],[left+176*s,top+41*s,52*s,42*s],[left+260*s,top+42*s,48*s,40*s],[left+421*s,top+42*s,48*s,40*s]])drawWindow(...p,s);
ctx.fillStyle=isDay?'#8c633f':'#3f3023';ctx.fillRect(left+335*s,ground-91*s,54*s,91*s);ctx.fillStyle=isDay?'#d3ae78':'#7b6547';ctx.fillRect(left+343*s,ground-82*s,38*s,28*s);ctx.strokeStyle=isDay?'#6c4d34':'#34281f';ctx.lineWidth=3*s;ctx.strokeRect(left+343*s,ground-82*s,38*s,28*s);
ctx.fillStyle=isDay?'#d8d1c5':'#55504b';ctx.fillRect(left+314*s,ground-104*s,112*s,9*s);ctx.fillStyle=isDay?'#8b8175':'#413c37';ctx.fillRect(left+318*s,ground-95*s,8*s,95*s);ctx.fillRect(left+414*s,ground-95*s,8*s,95*s);
ctx.fillStyle=isDay?'#c6b9a7':'#4b443c';ctx.fillRect(left+405*s,ground-86*s,118*s,9*s);ctx.fillStyle=isDay?'#827463':'#3b342d';ctx.fillRect(left+414*s,ground-77*s,7*s,77*s);ctx.fillRect(left+512*s,ground-77*s,7*s,77*s);
ctx.fillStyle=isDay?'#514943':'#22201e';ctx.fillRect(left+431*s,ground-29*s,70*s,29*s);ctx.fillStyle=isDay?'#aebbc2':'#4b5358';ctx.fillRect(left+443*s,ground-42*s,44*s,16*s);ctx.fillStyle='#222';for(const xx of [left+443*s,left+486*s]){ctx.beginPath();ctx.arc(xx,ground,9*s,0,Math.PI*2);ctx.fill()}
drawPorchLight(left+397*s,ground-108*s,s);drawFlowerBed(left+18*s,ground+3*s,185*s,s);drawBench(left+225*s,ground+24*s,s);drawPropertyFence(w,h,left,baseW,ground,s,'front');drawMailbox(left+baseW+50*s,ground+47*s,s,t);drawSteam(chimneyX+14*s,top-92*s,s,t);ctx.restore()}
function drawPropertyFence(w,h,left,houseW,ground,s,layer){ctx.save();ctx.strokeStyle=isDay?'#8b6a45':'#49382a';ctx.lineWidth=(layer==='back'?3.2:4.2)*s;ctx.lineCap='round';const backY=ground-8*s,frontY=ground+55*s,L=Math.max(8,left-38*s),R=Math.min(w-8,left+houseW+185*s);function rail(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}if(layer==='back'){for(let x=L;x<=R;x+=45*s)rail(x,backY-30*s,x,backY+12*s);rail(L,backY-14*s,R,backY-14*s);rail(L,backY+3*s,R,backY+3*s);rail(L,backY+3*s,L-36*s,frontY+5*s);rail(R,backY+3*s,R+26*s,frontY+4*s)}else{const gateL=left+houseW*.54,gateR=gateL+74*s;for(let x=L-36*s;x<=R+26*s;x+=45*s){if(x>gateL-20*s&&x<gateR+10*s)continue;rail(x,frontY-33*s,x,frontY+14*s)}for(const yy of [frontY-16*s,frontY+5*s]){rail(L-36*s,yy,gateL-18*s,yy);rail(gateR+10*s,yy,R+26*s,yy)}rail(gateL-18*s,frontY-37*s,gateL-18*s,frontY+15*s);rail(gateR+10*s,frontY-37*s,gateR+10*s,frontY+15*s)}ctx.restore()}
function drawPorchLight(x,y,s){ctx.save();if(!isDay){const g=ctx.createRadialGradient(x,y,1,x,y,34*s);g.addColorStop(0,'#ffd77aaa');g.addColorStop(1,'#ffd77a00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,34*s,0,Math.PI*2);ctx.fill()}ctx.fillStyle=isDay?'#4b4036':'#f4c766';ctx.fillRect(x-4*s,y-3*s,8*s,12*s);ctx.beginPath();ctx.arc(x,y-5*s,6*s,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawFlowerBed(x,y,width,s){ctx.save();ctx.fillStyle=isDay?'#3d6b38':'#27432c';ctx.beginPath();ctx.ellipse(x+width/2,y+8*s,width/2,18*s,0,0,Math.PI*2);ctx.fill();const cols=isDay?['#f2c95f','#e9837c','#e8a6d5','#f3efe0']:['#8b7650','#76535a','#70566b','#8a8677'];for(let i=0;i<20;i++){const fx=x+8*s+(i/19)*(width-16*s),fy=y+(i%3)*4*s;ctx.fillStyle=cols[i%cols.length];ctx.beginPath();ctx.arc(fx,fy,2.6*s,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawBench(x,y,s){ctx.save();ctx.strokeStyle=isDay?'#6f4d32':'#3d3025';ctx.lineWidth=6*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+76*s,y);ctx.moveTo(x+5*s,y-23*s);ctx.lineTo(x+71*s,y-23*s);ctx.moveTo(x+10*s,y+2*s);ctx.lineTo(x+3*s,y+24*s);ctx.moveTo(x+66*s,y+2*s);ctx.lineTo(x+73*s,y+24*s);ctx.stroke();ctx.restore()}
function drawMailbox(x,ground,s,t){const d=downwindVector(),wobble=d.x*Math.min(.075,wind*.0019)+Math.sin(t*.002)*.012;ctx.save();ctx.translate(x,ground);ctx.rotate(wobble);ctx.strokeStyle=isDay?'#604833':'#342a21';ctx.lineWidth=6*s;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-72*s);ctx.stroke();ctx.fillStyle=isDay?'#a44f42':'#63372f';ctx.fillRect(-18*s,-96*s,40*s,25*s);ctx.beginPath();ctx.arc(-18*s,-83.5*s,12.5*s,-Math.PI/2,Math.PI/2,true);ctx.fill();ctx.strokeStyle=isDay?'#d9c8b3':'#8b7568';ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(12*s,-96*s);ctx.lineTo(12*s,-116*s);ctx.lineTo(25*s,-116*s);ctx.stroke();ctx.fillStyle=isDay?'#365a31':'#203823';ctx.beginPath();ctx.ellipse(0,2*s,12*s,4*s,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawSteam(x,y,s,t){const d=downwindVector(),strength=Math.max(1,wind),bend=Math.min(150*s,strength*4.4*s);ctx.save();ctx.lineCap='round';for(let j=0;j<3;j++){ctx.beginPath();for(let i=0;i<=18;i++){const q=i/18,px=x+d.x*bend*q+Math.sin(t*.0012+i*.48+j*1.6)*(3+q*8)*s,py=y-q*112*s+d.y*bend*.13*q-Math.sin(q*Math.PI)*10*s;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.strokeStyle=isDay?`rgba(245,245,240,${.27-j*.055})`:`rgba(205,213,220,${.22-j*.045})`;ctx.lineWidth=(4.2-j*.7)*s;ctx.stroke()}ctx.restore()}
function drawTree(w,h,t){const ground=h*.79,x=w*.76,scale=Math.max(.78,Math.min(1.32,w/1100)),d=downwindVector(),sway=d.x*Math.min(12,wind*.28)+Math.sin(t*.0008)*2;ctx.save();ctx.translate(x,ground);ctx.fillStyle=isDay?'#5a3f2b':'#2b241d';ctx.beginPath();ctx.moveTo(-25*scale,5);ctx.bezierCurveTo(-19*scale,-70*scale,-18*scale,-135*scale,sway*scale,-210*scale);ctx.bezierCurveTo(18*scale,-140*scale,24*scale,-62*scale,31*scale,5);ctx.closePath();ctx.fill();ctx.strokeStyle=isDay?'#65462f':'#31271f';ctx.lineCap='round';ctx.lineWidth=13*scale;for(const b of [[0,-155,-70,-215],[4,-145,76,-198],[-3,-178,-40,-245],[8,-170,55,-240]]){ctx.beginPath();ctx.moveTo((b[0]+sway*.3)*scale,b[1]*scale);ctx.lineTo((b[2]+sway)*scale,b[3]*scale);ctx.stroke()}const canopyY=-238*scale,lean=sway*1.7*scale;ctx.fillStyle=isDay?'#477f3e':'#25462e';for(const c of [[-68,-2,76,54],[-8,-34,92,67],[72,-6,72,55],[-26,30,90,58]]){ctx.beginPath();ctx.ellipse(c[0]*scale+lean,canopyY+c[1]*scale,c[2]*scale,c[3]*scale,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle=isDay?'#5f9851':'#31583a';for(const c of [[-88,-20,43,31],[-20,-66,50,36],[54,-48,48,34],[92,-10,39,30],[-4,12,52,34]]){ctx.beginPath();ctx.ellipse(c[0]*scale+lean*.8,canopyY+c[1]*scale,c[2]*scale,c[3]*scale,0,0,Math.PI*2);ctx.fill()}ctx.restore();drawTreeLeaves(w,h,t,x,ground-238*scale,scale)}
function drawTreeLeaves(w,h,t,treeX,treeY,scale){const d=downwindVector(),target=Math.min(24,Math.max(3,Math.floor(wind*.55)));if(leafParticles.length<target&&Math.random()<.22){leafParticles.push({x:treeX+(Math.random()-.5)*150*scale,y:treeY+(Math.random()-.5)*80*scale,v:.5+Math.random(),rot:Math.random()*6.28,life:0,sz:(3+Math.random()*4)*scale})}for(const p of leafParticles){p.x+=d.x*(.7+wind*.035)*p.v;p.y+=d.y*(.25+wind*.012)*p.v+(.18+.18*p.v);p.rot+=.05*p.v;p.life++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=isDay?'#6f9148':'#405234';ctx.beginPath();ctx.ellipse(0,0,p.sz,p.sz*.45,0,0,Math.PI*2);ctx.fill();ctx.restore()}leafParticles=leafParticles.filter(p=>p.x>-80&&p.x<w+80&&p.y>-80&&p.y<h+80&&p.life<900)}
function kiteCount(){if(!isDay||wind<4||wind>45)return 0;if(wind<9)return 1;if(wind<23)return 2;return 3}
function drawKites(w,h,t){const count=kiteCount(),d=downwindVector(),gustBoost=Math.min(1,Math.max(0,gust-wind)/18);for(let i=0;i<count;i++){const k=kites[i],anchorX=w*(k.x-.06),anchorY=h*.80,baseX=w*k.x,baseY=h*k.y-(wind*1.05),bob=Math.sin(t*.0018+k.p)*(7+wind*.17),swayX=d.x*(18+wind*1.3)+Math.sin(t*.0012+k.p)*7*(1+gustBoost),swayY=d.y*(6+wind*.28),x=baseX+swayX,y=baseY+bob+swayY;ctx.strokeStyle='#ffffff80';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(anchorX,anchorY);ctx.quadraticCurveTo((anchorX+x)*.5-d.x*18,anchorY-90-(wind*1.4),x,y+14);ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(d.y,d.x)+Math.PI/2+Math.sin(t*.0018+k.p)*.05);ctx.fillStyle=k.c;ctx.beginPath();ctx.moveTo(0,-18);ctx.bezierCurveTo(13,-13,16,-4,15,0);ctx.bezierCurveTo(13,8,7,14,0,20);ctx.bezierCurveTo(-7,14,-13,8,-15,0);ctx.bezierCurveTo(-16,-4,-13,-13,0,-18);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffff88';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(0,18);ctx.stroke();ctx.restore();ctx.strokeStyle=k.c;ctx.lineWidth=1.4;ctx.beginPath();for(let j=0;j<8;j++){const q=j/7,tx=x+d.x*(12+q*58)+Math.sin(t*.003+j+k.p)*4,ty=y+20+d.y*(12+q*58)+q*34;if(j===0)ctx.moveTo(tx,ty);else ctx.lineTo(tx,ty)}ctx.stroke();for(let j=2;j<7;j+=2){const q=j/7,tx=x+d.x*(12+q*58)+Math.sin(t*.003+j+k.p)*4,ty=y+20+d.y*(12+q*58)+q*34;ctx.fillStyle=k.c;ctx.beginPath();ctx.moveTo(tx-4,ty-2);ctx.lineTo(tx,ty+2);ctx.lineTo(tx+4,ty-2);ctx.lineTo(tx,ty-5);ctx.closePath();ctx.fill()}}}
function drawNightParticles(w,h,t){if(isDay)return;const strength=Math.max(1,wind),d=downwindVector();if(particles.length<Math.min(40,8+strength)){particles.push({x:Math.random()*w,y:h*.25+Math.random()*h*.62,v:.45+Math.random()*1.3,a:Math.random()*6.28,fire:wind<6&&Math.random()>.45,sz:3+Math.random()*4})}particles=particles.filter(p=>p.x>-90&&p.x<w+90&&p.y>-90&&p.y<h+90);for(const p of particles){p.x+=d.x*strength*.028*p.v;p.y+=d.y*strength*.013*p.v;p.a+=.04*p.v;if(p.fire){ctx.fillStyle='#eaff91';ctx.globalAlpha=.5+.4*Math.sin(t*.004+p.a);ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill()}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(d.y,d.x)+p.a*.12);ctx.fillStyle='#8a6a42bb';ctx.globalAlpha=.72;ctx.beginPath();ctx.ellipse(0,0,p.sz,2,0,0,Math.PI*2);ctx.fill();ctx.restore()}}ctx.globalAlpha=1}
function draw(t){const r=stage.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);drawSky(w,h);drawClouds(w,h,t);drawField(w,h);drawFarmhouse(w,h,t);drawTree(w,h,t);drawKites(w,h,t);drawNightParticles(w,h,t);requestAnimationFrame(draw)}
async function loadCatalog(){try{catalog=await fetch('https://raw.githubusercontent.com/bennessism/window/main/weather/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()})}catch(e){catalog={default:{country:'my',location:'selangor'},countries:{my:{name:'Malaysia',locations:[{id:'selangor',name:'Selangor',city:'Shah Alam',lat:3.0738,lon:101.5183}]}}}}populateCountries()}
function populateCountries(){countrySelect.innerHTML='';Object.entries(catalog.countries).forEach(([id,c])=>{const o=document.createElement('option');o.value=id;o.textContent=c.name;countrySelect.append(o)});countrySelect.value=localStorage.getItem('windCountry')||catalog.default.country||'my';if(!catalog.countries[countrySelect.value])countrySelect.value=Object.keys(catalog.countries)[0];populateLocations()}
function populateLocations(){locationSelect.innerHTML='';const c=catalog.countries[countrySelect.value];c.locations.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.name+(l.city&&l.city!==l.name?' · '+l.city:'');locationSelect.append(o)});const saved=localStorage.getItem('windLocation')||catalog.default.location;if(c.locations.some(l=>l.id===saved))locationSelect.value=saved}
function selectedLocation(){const c=catalog.countries[countrySelect.value];return c.locations.find(l=>l.id===locationSelect.value)||c.locations[0]}
function labelFor(loc){return loc.city&&loc.city!==loc.name?`${loc.name} · ${loc.city}`:loc.name}function areaFor(loc){return loc.name||loc.city||'Location'}
function fmtTime(iso){if(!iso)return'--';const m=String(iso).match(/T(\d{2}):(\d{2})/);if(!m)return'--';let h=Number(m[1]);const min=m[2],s=h>=12?'PM':'AM';h=h%12||12;return`${h}:${min} ${s}`}
function refreshUI(updatedIso){const strength=windStrength(wind),dir=compassName(windDir);summaryLine.textContent=`${currentArea} · ${strength} · ${Math.round(wind)} km/h`;detailLoc.textContent=currentPlace;conditionEl.textContent=strength;speedEl.textContent=Math.round(wind);gustEl.textContent=Math.round(gust)+' km/h';fromText.textContent='From '+dir;directionEl.textContent=`${dir} · ${Math.round(windDir)}°`;updatedEl.textContent='Updated '+fmtTime(updatedIso)}
async function loadWind(lat=currentLat,lon=currentLon,label=currentPlace,area=currentArea){currentLat=lat;currentLon=lon;currentPlace=label;currentArea=area;try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&wind_speed_unit=kmh&timezone=auto`;const j=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()});wind=Number(j.current.wind_speed_10m)||0;gust=Number(j.current.wind_gusts_10m)||wind;windDir=Number(j.current.wind_direction_10m)||0;isDay=Number(j.current.is_day)===1;document.querySelector('meta[name="theme-color"]').content=isDay?'#76b7e8':'#07111f';refreshUI(j.current.time);seedScene(stage.clientWidth,stage.clientHeight)}catch(e){summaryLine.textContent=currentArea+' · data unavailable'}}
function useBrowserLocation(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{picker.classList.remove('show');loadWind(p.coords.latitude,p.coords.longitude,'Your location','Your location')},()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:600000})}
summaryBtn.onclick=()=>{const open=detailCard.classList.toggle('show');summaryBtn.classList.toggle('open',open);if(!open)picker.classList.remove('show')};document.getElementById('detailClose').onclick=()=>{detailCard.classList.remove('show');summaryBtn.classList.remove('open');picker.classList.remove('show')};document.getElementById('changeLocationBtn').onclick=()=>picker.classList.toggle('show');countrySelect.onchange=populateLocations;document.getElementById('myLocationBtn').onclick=useBrowserLocation;document.getElementById('applyLocationBtn').onclick=()=>{const loc=selectedLocation();localStorage.setItem('windCountry',countrySelect.value);localStorage.setItem('windLocation',loc.id);picker.classList.remove('show');loadWind(loc.lat,loc.lon,labelFor(loc),areaFor(loc))};
scroller.addEventListener('scroll',()=>{if(innerWidth>700)return;const i=Math.max(0,Math.min(2,Math.round(scroller.scrollLeft/innerWidth)));document.querySelectorAll('.dots i').forEach((d,n)=>d.classList.toggle('on',n===i))},{passive:true});addEventListener('resize',resize);resize();requestAnimationFrame(draw);loadCatalog().then(()=>{const loc=selectedLocation();loadWind(loc.lat,loc.lon,labelFor(loc),areaFor(loc))});setInterval(()=>loadWind(),10*60*1000);
</script>
