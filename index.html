<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>Rooms — Endless Gallery</title>
<style>
:root{--bg:#111;--ink:#f5f3ee;--muted:#aaa;--panel:rgba(10,10,10,.62);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d0d;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;background:#111;isolation:isolate}
#world{position:absolute;inset:0;overflow:hidden;background:#1a1a1a;transition:filter .35s ease}
.corridor{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#c9c5bc 0 16%,#eee9df 16% 69%,#77736c 69% 100%);perspective:850px;transform-style:preserve-3d}
.corridor::before{content:"";position:absolute;left:18%;right:18%;top:0;height:18%;background:linear-gradient(90deg,#aaa79f,#efede7 16% 84%,#aaa79f);clip-path:polygon(12% 0,88% 0,70% 100%,30% 100%);opacity:.7}
.corridor::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:35%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 1px,transparent 1px 80px),linear-gradient(#8f8b83,#5f5b55);clip-path:polygon(0 100%,100% 100%,70% 0,30% 0)}
.wall{position:absolute;top:15%;bottom:30%;width:50%;background:linear-gradient(#e5e1d8,#cbc6bc);overflow:hidden}
.wall.left{left:0;clip-path:polygon(0 0,100% 16%,100% 84%,0 100%)}
.wall.right{right:0;clip-path:polygon(0 16%,100% 0,100% 100%,0 84%)}
.end-wall{position:absolute;left:38%;right:38%;top:29%;bottom:29%;background:linear-gradient(#ded9cf,#c7c0b5);border:1px solid rgba(0,0,0,.08);box-shadow:0 0 40px rgba(0,0,0,.15)}
.end-opening{position:absolute;left:43%;right:43%;top:36%;bottom:29%;background:linear-gradient(#191919,#080808);border:5px solid #a49d90;border-bottom:0;box-shadow:inset 0 0 22px #000}
.frame{position:absolute;background:#f5f1e8;padding:6px;border:5px solid #272522;box-shadow:0 7px 18px rgba(0,0,0,.2);overflow:hidden}
.frame canvas{display:block;width:100%;height:100%}
.left .frame{transform:skewY(6deg)} .right .frame{transform:skewY(-6deg)}
.door{position:absolute;bottom:8%;width:18%;height:58%;border:5px solid rgba(65,55,45,.58);border-bottom:0;background:linear-gradient(90deg,#6d5a47,#957b5f 45%,#725c45);box-shadow:0 8px 20px rgba(0,0,0,.28);cursor:pointer;transition:filter .2s,transform .2s;z-index:4}
.door:hover,.door:focus-visible{filter:brightness(1.14);outline:none}
.door::after{content:"";position:absolute;right:12%;top:49%;width:7px;height:7px;border-radius:50%;background:#d7b86d;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.left .door{left:4%;transform:skewY(6deg)} .right .door{right:4%;transform:skewY(-6deg)}
.door[data-kind="plant"]{background:linear-gradient(90deg,#3a5641,#66816c,#405b46)}
.door[data-kind="rain"]{background:linear-gradient(90deg,#50616f,#8195a2,#526573)}
.door[data-kind="dark"]{background:linear-gradient(90deg,#18191d,#30313a,#15161a)}
.door[data-kind="light"]{background:linear-gradient(90deg,#ddd9cf,#fffef8,#d8d4ca)}
.door[data-kind="ghost"]{background:linear-gradient(90deg,#4b4561,#7a7199,#4e4766)}
.door[data-kind="color"]{background:linear-gradient(135deg,#d55,#e4a,#67c,#4bb)}
.door[data-kind="mirror"]{background:linear-gradient(120deg,#8f969b,#edf2f3 45%,#747d83 60%,#dce1e3)}
.sign{position:absolute;left:50%;top:16px;transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(10,10,10,.52);backdrop-filter:blur(8px);font-size:12px;letter-spacing:.08em;text-transform:uppercase;z-index:20;white-space:nowrap}
.hud{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:30;padding:8px;background:rgba(15,15,15,.58);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px)}
.hud button,.room-close{border:1px solid var(--line);background:rgba(255,255,255,.08);width:48px;height:48px;border-radius:13px;cursor:pointer;display:grid;place-items:center;font-size:21px;transition:background .2s,transform .15s}
.hud button:hover,.room-close:hover{background:rgba(255,255,255,.17)} .hud button:active,.room-close:active{transform:scale(.94)}
#stepCount{min-width:72px;text-align:center;font-size:12px;color:#ddd}
#room{position:absolute;inset:0;z-index:50;display:none;overflow:hidden;background:#ddd;color:#111;opacity:0;transition:opacity .35s}
#room.show{display:block;opacity:1}.room-scene{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.room-close{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:90;background:rgba(0,0,0,.38);color:#fff}
.room-label{position:absolute;left:20px;bottom:20px;z-index:80;padding:9px 13px;border-radius:12px;background:rgba(0,0,0,.45);color:white;font-size:12px;letter-spacing:.04em;backdrop-filter:blur(10px)}
.gallery-room{background:linear-gradient(#eeeae2 0 72%,#726e67 72%)}
.art-grid{display:flex;gap:clamp(18px,4vw,60px);align-items:center;justify-content:center;width:88%;height:60%}.art-big{width:min(60vw,650px);height:min(62vh,600px)}
.room-art{background:#fff;padding:10px;border:8px solid #292724;box-shadow:0 16px 35px rgba(0,0,0,.22)}.room-art canvas{width:100%;height:100%;display:block}
.color-room{animation:colorShift 14s linear infinite alternate}@keyframes colorShift{0%{background:#ef9aa7}25%{background:#92bfc8}50%{background:#d7bf72}75%{background:#927eb3}100%{background:#85b58b}}
.dark-room{background:radial-gradient(circle at 50% 35%,#2d2740,#08080d 70%)}.light-room{background:linear-gradient(135deg,#fff,#eceae3);animation:lightMove 8s ease-in-out infinite alternate}@keyframes lightMove{to{filter:brightness(.83)}}
.rain-room{background:linear-gradient(#293741,#12191e)}.window{width:min(76vw,900px);height:min(64vh,620px);border:16px solid #282b2d;background:linear-gradient(#314755,#17242d);position:relative;box-shadow:0 25px 60px #0008;overflow:hidden}.window::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 22px,rgba(210,235,245,.4) 23px 24px,transparent 25px 48px);animation:rain .55s linear infinite}@keyframes rain{to{transform:translate(-26px,60px)}}
.plant-room{background:linear-gradient(#d9e2d2 0 70%,#8a765e 70%)}.plant{position:absolute;bottom:8%;font-size:clamp(55px,10vw,130px);filter:drop-shadow(0 12px 10px #0003)}
.plant.p1{left:7%}.plant.p2{right:8%;transform:scale(.75)}.plant.p3{left:35%;bottom:5%;transform:scale(.55)}
.mirror-room{background:linear-gradient(120deg,#a7b1b6,#eef2f2 30%,#808b90 48%,#e9eded 70%,#939da2);animation:mirrorGlow 7s ease-in-out infinite alternate}@keyframes mirrorGlow{to{filter:hue-rotate(25deg) brightness(1.08)}}
.float-room{background:radial-gradient(circle,#d8d0e9,#7c7591)}.shape{position:absolute;width:90px;height:90px;background:rgba(255,255,255,.35);border:1px solid #fff8;animation:drift 8s ease-in-out infinite alternate;box-shadow:0 10px 30px #0002}.shape:nth-child(2n){border-radius:50%;animation-duration:11s}.shape:nth-child(3n){border-radius:35% 65% 55% 45%;animation-duration:14s}@keyframes drift{to{transform:translate(70px,-90px) rotate(150deg)}}
.sculpture-room{background:linear-gradient(#e8e5de 0 73%,#78736a 73%)}.sculpture{width:min(34vw,330px);aspect-ratio:1;border-radius:37% 63% 45% 55% / 56% 35% 65% 44%;background:linear-gradient(135deg,#25252b,#a7a2b6 48%,#31303a);box-shadow:0 30px 50px #0004;animation:sculpt 12s ease-in-out infinite alternate}@keyframes sculpt{to{transform:rotate(25deg) scale(.92);border-radius:64% 36% 68% 32% / 39% 65% 35% 61%}}
.tiny-room{background:#d8d1c5}.tiny-box{width:min(58vw,420px);height:min(54vh,390px);background:#f2eee7;border:18px solid #8d8172;box-shadow:0 20px 50px #0004;display:grid;place-items:center;font-size:55px}.huge-room{background:linear-gradient(#dcd8d1 0 78%,#5b5955 78%)}.huge-room::before{content:"";position:absolute;width:22vw;height:34vh;left:39vw;bottom:22%;background:#f5f2ea;border:9px solid #292725;box-shadow:0 10px 30px #0003}.empty-room{background:linear-gradient(#e8e3da 0 76%,#918b81 76%)}
.sound-room{background:radial-gradient(circle at 50% 50%,#33404f,#13171d)}.sound-ring{position:absolute;width:100px;height:100px;border:2px solid #cfe3ff;border-radius:50%;opacity:.7;animation:ring 3s ease-out infinite}.sound-ring:nth-child(2){animation-delay:1s}.sound-ring:nth-child(3){animation-delay:2s}@keyframes ring{to{transform:scale(6);opacity:0}}
.ghost-room{background:radial-gradient(circle at center,#51476c,#15131d 70%)}.ghost{position:absolute;width:76px;height:98px;border-radius:52% 48% 42% 58%/43% 46% 54% 57%;background:rgba(238,244,255,.75);box-shadow:0 0 25px rgba(196,215,255,.48);animation:ghostFloat 4s ease-in-out infinite alternate}.ghost::before,.ghost::after{content:"";position:absolute;top:34%;width:8px;height:12px;border-radius:50%;background:#262437}.ghost::before{left:27%}.ghost::after{right:27%}.ghost span{position:absolute;inset:auto 0 -20px;height:44px;background:inherit;clip-path:polygon(0 0,18% 45%,34% 8%,50% 58%,67% 12%,82% 52%,100% 0,100% 100%,0 100%)}@keyframes ghostFloat{to{transform:translateY(-26px) rotate(4deg)}}
@media(max-width:700px){.wall{width:54%}.end-wall{left:35%;right:35%}.end-opening{left:41%;right:41%}.frame{border-width:3px;padding:3px}.door{width:22%;height:52%}.hud button{width:44px;height:44px}.art-grid{gap:12px}.room-art{border-width:5px;padding:5px}}
</style>
</head>
<body>
<div id="app">
  <div id="world"></div>
  <div class="sign" id="sign">Endless Gallery · Corridor 1</div>
  <div class="hud" aria-label="Navigation">
    <button id="left" aria-label="Turn left">↶</button>
    <button id="forward" aria-label="Walk forward">↑</button>
    <button id="right" aria-label="Turn right">↷</button>
    <div id="stepCount">0 steps</div>
  </div>
  <section id="room" aria-hidden="true">
    <button class="room-close" id="roomClose" aria-label="Return to corridor">×</button>
    <div id="roomScene" class="room-scene"></div>
    <div class="room-label" id="roomLabel"></div>
  </section>
</div>
<script>
const TYPES=["gallery","one","color","mirror","float","rain","plant","dark","light","sound","sculpture","tiny","huge","empty","corridor","ghost"];
const LABELS={gallery:"Mini Gallery Room",one:"One Painting Room",color:"Color Room",mirror:"Mirror Room",float:"Floating Shapes Room",rain:"Rain Room",plant:"Plant Room",dark:"Dark Gallery",light:"Light Room",sound:"Sound Room",sculpture:"Sculpture Room",tiny:"Tiny Room",huge:"Huge Hall",empty:"Empty Room",corridor:"Another Corridor",ghost:"Ghost Room"};
let step=0,corridor=1,facing=0,seed=(Date.now()>>>0)%2147483647;
const world=document.querySelector('#world'), sign=document.querySelector('#sign'), stepCount=document.querySelector('#stepCount');
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return n>>>0}
function rnd(n,s=0){return (hash(seed+n*977+s*131)%10000)/10000}
function palette(n){const sets=[["#e95f67","#f3c969","#4e8ea6","#25364a"],["#6c63a8","#cf8fb3","#78b7a4","#f1d590"],["#22223b","#4a4e69","#9a8c98","#f2e9e4"],["#e07a5f","#f2cc8f","#81b29a","#3d405b"],["#114b5f","#1a936f","#88d498","#c6dabf"]];return sets[hash(n)%sets.length]}
function drawArt(canvas,n){const ctx=canvas.getContext('2d'),w=canvas.width=360,h=canvas.height=260,p=palette(n);ctx.fillStyle=p[3];ctx.fillRect(0,0,w,h);const mode=hash(n)%4;for(let i=0;i<14;i++){ctx.globalAlpha=.35+rnd(n,i)*.55;ctx.fillStyle=p[i%p.length];ctx.strokeStyle=p[(i+1)%p.length];ctx.lineWidth=4+rnd(i,n)*18;if(mode===0){ctx.beginPath();ctx.arc(rnd(n,i+4)*w,rnd(n,i+8)*h,20+rnd(i,n+2)*100,0,Math.PI*2);ctx.fill()}else if(mode===1){ctx.save();ctx.translate(rnd(n,i+3)*w,rnd(n,i+7)*h);ctx.rotate(rnd(i,n)*Math.PI);ctx.fillRect(-70,-20,140+rnd(i,2)*100,25+rnd(i,4)*70);ctx.restore()}else if(mode===2){ctx.beginPath();ctx.moveTo(rnd(n,i)*w,rnd(n,i+2)*h);ctx.bezierCurveTo(rnd(i,n)*w,rnd(i,n+1)*h,rnd(i,n+5)*w,rnd(i,n+9)*h,rnd(n,i+6)*w,rnd(n,i+11)*h);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(rnd(n,i)*w,0);ctx.lineTo(rnd(i,n+4)*w,h);ctx.stroke()}}ctx.globalAlpha=1}
function makeFrame(side,index,top,left,width,height){const f=document.createElement('div');f.className='frame';Object.assign(f.style,{top:top+'%',left:left+'%',width:width+'%',height:height+'%'});const c=document.createElement('canvas');f.append(c);drawArt(c,step*31+index*17+(side==='left'?7:13));return f}
function corridorHTML(){world.innerHTML='';const c=document.createElement('div');c.className='corridor';const lw=document.createElement('div'),rw=document.createElement('div');lw.className='wall left';rw.className='wall right';lw.append(makeFrame('left',1,18,34,28,27),makeFrame('left',2,48,61,19,20));rw.append(makeFrame('right',3,18,39,28,27),makeFrame('right',4,48,20,19,20));
  const leftType=TYPES[hash(step*19+facing+seed)%TYPES.length],rightType=TYPES[hash(step*23+facing+seed+9)%TYPES.length];
  const ld=document.createElement('button');ld.className='door';ld.dataset.kind=leftType;ld.title=LABELS[leftType];ld.onclick=()=>openRoom(leftType,step*2+1);lw.append(ld);
  const rd=document.createElement('button');rd.className='door';rd.dataset.kind=rightType;rd.title=LABELS[rightType];rd.onclick=()=>openRoom(rightType,step*2+2);rw.append(rd);
  c.append(lw,rw);const ew=document.createElement('div');ew.className='end-wall';const eo=document.createElement('div');eo.className='end-opening';c.append(ew,eo);world.append(c);
  sign.textContent=`Endless Gallery · Corridor ${corridor}`;stepCount.textContent=`${step} step${step===1?'':'s'}`;
}
function walk(){step++;if(step%5===0){corridor++;facing=(facing+(rnd(step,7)>.5?1:3))%4}world.animate([{transform:'scale(1)'},{transform:'scale(1.08)',offset:.45},{transform:'scale(1)'}],{duration:420,easing:'ease-in-out'});setTimeout(corridorHTML,190)}
function turn(dir){facing=(facing+(dir<0?3:1))%4;corridor++;world.animate([{transform:'rotateY(0deg)'},{transform:`rotateY(${dir*10}deg)`,opacity:.55},{transform:'rotateY(0deg)',opacity:1}],{duration:430,easing:'ease-in-out'});setTimeout(corridorHTML,210)}
function addArts(scene,count,big=false,n=0){const grid=document.createElement('div');grid.className=big?'art-big room-art':'art-grid';if(big){const c=document.createElement('canvas');grid.append(c);drawArt(c,n);scene.append(grid);return}for(let i=0;i<count;i++){const a=document.createElement('div');a.className='room-art';a.style.width=`${Math.max(120,Math.min(220,650/count))}px`;a.style.height=`${180+(i%2)*45}px`;const c=document.createElement('canvas');a.append(c);drawArt(c,n+i*41);grid.append(a)}scene.append(grid)}
function ghosts(scene,n,count){for(let i=0;i<count;i++){const g=document.createElement('div');g.className='ghost';g.style.left=(8+rnd(n,i)*78)+'%';g.style.top=(12+rnd(i,n)*60)+'%';g.style.transform=`scale(${.55+rnd(n+4,i)*1.2})`;g.style.animationDelay=(-rnd(i,n+8)*4)+'s';g.style.filter=`hue-rotate(${Math.floor(rnd(n,i+15)*120)}deg)`;g.innerHTML='<span></span>';scene.append(g)}}
function openRoom(type,n){if(type==='corridor'){corridor+=2;step++;corridorHTML();return}const room=document.querySelector('#room'),scene=document.querySelector('#roomScene');scene.className='room-scene';scene.innerHTML='';document.querySelector('#roomLabel').textContent=LABELS[type]+' · Door '+(n+1);
  if(type==='gallery'){scene.classList.add('gallery-room');addArts(scene,3+hash(n)%4,false,n)}
  if(type==='one'){scene.classList.add('gallery-room');addArts(scene,1,true,n)}
  if(type==='color')scene.classList.add('color-room');
  if(type==='mirror'){scene.classList.add('mirror-room');for(let i=0;i<7;i++){const s=document.createElement('div');s.className='shape';s.style.left=(5+i*14)+'%';s.style.top=(15+(i%3)*22)+'%';scene.append(s)}}
  if(type==='float'){scene.classList.add('float-room');for(let i=0;i<12;i++){const s=document.createElement('div');s.className='shape';s.style.left=(rnd(n,i)*90)+'%';s.style.top=(rnd(i,n)*80)+'%';s.style.transform=`scale(${.4+rnd(i,n+2)}) rotate(${rnd(n,i+4)*180}deg)`;scene.append(s)}}
  if(type==='rain'){scene.classList.add('rain-room');const w=document.createElement('div');w.className='window';scene.append(w)}
  if(type==='plant'){scene.classList.add('plant-room');['🪴','🌿','🌱'].forEach((x,i)=>{const p=document.createElement('div');p.className='plant p'+(i+1);p.textContent=x;scene.append(p)});addArts(scene,2,false,n)}
  if(type==='dark'){scene.classList.add('dark-room');addArts(scene,3,false,n);ghosts(scene,n,hash(n)%2)}
  if(type==='light'){scene.classList.add('light-room');addArts(scene,2,false,n)}
  if(type==='sound'){scene.classList.add('sound-room');for(let i=0;i<3;i++){const r=document.createElement('div');r.className='sound-ring';scene.append(r)}}
  if(type==='sculpture'){scene.classList.add('sculpture-room');const s=document.createElement('div');s.className='sculpture';scene.append(s)}
  if(type==='tiny'){scene.classList.add('tiny-room');const b=document.createElement('div');b.className='tiny-box';b.textContent='🪑';scene.append(b)}
  if(type==='huge')scene.classList.add('huge-room');
  if(type==='empty')scene.classList.add('empty-room');
  if(type==='ghost'){scene.classList.add('ghost-room');ghosts(scene,n,4+hash(n)%9)}
  room.style.display='block';requestAnimationFrame(()=>room.classList.add('show'));room.setAttribute('aria-hidden','false')}
function closeRoom(){const room=document.querySelector('#room');room.classList.remove('show');room.setAttribute('aria-hidden','true');setTimeout(()=>room.style.display='none',330)}
document.querySelector('#forward').onclick=walk;document.querySelector('#left').onclick=()=>turn(-1);document.querySelector('#right').onclick=()=>turn(1);document.querySelector('#roomClose').onclick=closeRoom;
document.addEventListener('keydown',e=>{if(document.querySelector('#room').classList.contains('show')){if(e.key==='Escape')closeRoom();return}if(e.key==='ArrowUp'||e.key==='w')walk();if(e.key==='ArrowLeft'||e.key==='a')turn(-1);if(e.key==='ArrowRight'||e.key==='d')turn(1)});
let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(document.querySelector('#room').classList.contains('show'))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))turn(dx<0?1:-1);else if(dy<-70)walk()},{passive:true});
corridorHTML();
</script>
</body>
</html>
