<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#76b7e8">
<title>Wind Field</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#82bfe9;color:#fff}button,select{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;overflow:hidden}#scroller{position:absolute;inset:0;overflow:hidden}#stage{position:relative;width:100vw;height:100vh;min-height:480px}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:20;display:flex;gap:10px;align-items:stretch;pointer-events:none}.card{background:#0b1722a8;border:1px solid #ffffff2b;box-shadow:0 12px 35px #0002;backdrop-filter:blur(12px);border-radius:18px}.weather{min-width:190px;padding:12px 14px}.place{font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.speed{font-size:29px;font-weight:760;line-height:1.05;margin-top:4px}.sub{font-size:12px;opacity:.82;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}.compass{width:94px;height:94px;position:relative;display:grid;place-items:center}.compass span{position:absolute;font-size:10px;font-weight:700;opacity:.8}.n{top:7px}.s{bottom:7px}.e{right:8px}.w{left:8px}.dial{width:48px;height:48px;border:1px solid #ffffff55;border-radius:50%;position:relative}.arrow{position:absolute;left:50%;top:50%;width:3px;height:22px;background:#fff;border-radius:3px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);box-shadow:0 0 8px #fff8}.arrow:before{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid #fff}.centerDot{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.controls{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:25;display:flex;gap:8px}.controls button{border:1px solid #ffffff2b;background:#0b1722a8;backdrop-filter:blur(12px);border-radius:999px;padding:10px 13px;cursor:pointer}.controls button:active{transform:scale(.97)}.status{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;padding:8px 12px;border-radius:999px;background:#0b172294;border:1px solid #ffffff22;backdrop-filter:blur(10px);font-size:11px;letter-spacing:.03em;opacity:.9;white-space:nowrap}.dots{display:none}
.pickerBack{position:fixed;inset:0;z-index:80;background:#06101db8;display:none;place-items:center;padding:20px;backdrop-filter:blur(8px)}.pickerBack.show{display:grid}.picker{width:min(440px,100%);background:#142230f2;border:1px solid #ffffff24;border-radius:22px;padding:18px;box-shadow:0 24px 70px #0005}.pickerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pickerTitle{font-weight:700}.pickerClose{width:36px;height:36px;border:1px solid #ffffff22;border-radius:50%;background:#ffffff0d;cursor:pointer}.fieldLabel{font-size:11px;opacity:.7;margin:12px 0 6px}.picker select{width:100%;padding:11px 12px;border:1px solid #ffffff22;border-radius:12px;background:#0b1722;color:#fff;outline:none}.pickerActions{display:flex;gap:8px;margin-top:16px}.pickerActions button{flex:1;border:1px solid #ffffff24;background:#ffffff12;border-radius:12px;padding:11px;cursor:pointer}.pickerActions .primary{background:#ffffffea;color:#10202d;font-weight:700}.catalogNote{font-size:10px;opacity:.55;margin-top:11px;text-align:center}
@media(max-width:700px){#scroller{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}#stage{width:300vw}.panelSnap{position:absolute;top:0;bottom:0;width:100vw;scroll-snap-align:start;pointer-events:none}.p1{left:0}.p2{left:100vw}.p3{left:200vw}.hud{right:10px;top:10px;gap:6px}.weather{min-width:145px;padding:9px 10px}.speed{font-size:22px}.sub{font-size:10px;gap:7px}.place{max-width:150px}.compass{width:78px;height:78px}.dial{width:40px;height:40px}.arrow{height:18px}.controls{left:10px;top:10px}.controls button{padding:9px 11px;font-size:12px}.status{bottom:30px;font-size:10px}.dots{display:flex;position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;gap:7px}.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#ffffff66}.dots i.on{background:#fff}}
</style>
</head>
<body>
<div id="viewport">
  <div id="scroller"><div id="stage"><canvas id="scene"></canvas><div class="panelSnap p1"></div><div class="panelSnap p2"></div><div class="panelSnap p3"></div></div></div>
  <div class="controls"><button id="locBtn">⌖ Location</button><button id="refreshBtn" aria-label="Refresh wind">↻</button></div>
  <div class="hud"><div class="card weather"><div class="place" id="place">Loading wind…</div><div class="speed"><span id="speed">--</span> <small style="font-size:13px;font-weight:500">km/h</small></div><div class="sub"><span id="dirText">--</span><span>Gust <b id="gust">--</b></span><span id="phase">--</span></div></div><div class="card compass"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><div class="dial"><div class="arrow" id="arrow"></div><div class="centerDot"></div></div></div></div>
  <div class="status" id="status">Live wind drives the field</div><div class="dots"><i class="on"></i><i></i><i></i></div>
</div>
<div class="pickerBack" id="pickerBack"><div class="picker"><div class="pickerHead"><div class="pickerTitle">Choose location</div><button class="pickerClose" id="pickerClose">×</button></div><div class="fieldLabel">Country</div><select id="countrySelect"></select><div class="fieldLabel">Location</div><select id="locationSelect"></select><div class="pickerActions"><button id="myLocationBtn">◎ My location</button><button class="primary" id="applyLocationBtn">Use location</button></div><div class="catalogNote">Location list shared with BENNESSism Window</div></div></div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),scroller=document.getElementById('scroller');
const speedEl=document.getElementById('speed'),gustEl=document.getElementById('gust'),dirEl=document.getElementById('dirText'),phaseEl=document.getElementById('phase'),placeEl=document.getElementById('place'),arrow=document.getElementById('arrow'),statusEl=document.getElementById('status');
const pickerBack=document.getElementById('pickerBack'),countrySelect=document.getElementById('countrySelect'),locationSelect=document.getElementById('locationSelect');
let wind=12,gust=18,windDir=250,isDay=true,particles=[],stars=[],kites=[],clouds=[],catalog=null;
let currentLat=3.0738,currentLon=101.5183,currentPlace='Selangor · Shah Alam';
const DPR=()=>Math.min(devicePixelRatio||1,2);
function resize(){const r=stage.getBoundingClientRect(),d=DPR();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);seedScene(r.width,r.height)}
function seedScene(w,h){stars=Array.from({length:115},()=>({x:Math.random()*w,y:Math.random()*h*.58,r:.35+Math.random()*1.2,a:.28+Math.random()*.72}));clouds=Array.from({length:7},(_,i)=>({x:(i/7)*w+Math.random()*230,y:45+Math.random()*165,s:.62+Math.random()*1.2,p:Math.random()*6.28}));kites=[{x:.57,y:.30,c:'#ff5b67',p:0},{x:.72,y:.23,c:'#ffd54a',p:2.1},{x:.85,y:.34,c:'#4ad1c8',p:4.2}];particles=[]}
function compassName(deg){const n=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return n[Math.round((deg%360)/22.5)%16]}
function skyColors(){return isDay?['#6fb4e8','#d9efff','#f3d6a4']:['#06101d','#132640','#263a53']}
function drawSky(w,h){const c=skyColors(),g=ctx.createLinearGradient(0,0,0,h*.72);g.addColorStop(0,c[0]);g.addColorStop(.66,c[1]);g.addColorStop(1,c[2]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(!isDay){ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowColor='#fff4c777';ctx.shadowBlur=18;ctx.fillStyle='#f5efcf';ctx.beginPath();ctx.arc(w*.82,h*.145,27,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}else{ctx.fillStyle='#fff8c6';ctx.globalAlpha=.83;ctx.beginPath();ctx.arc(w*.84,h*.13,34,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function cloudX(c,w,t){const sign=Math.sin(windDir*Math.PI/180)>=0?1:-1,drift=sign*Math.max(3.2,wind*.16);return ((c.x+t*drift*.003)%(w+360)+w+360)%(w+360)-180}
function drawClouds(w,h,t){ctx.fillStyle=isDay?'#ffffffb0':'#bac8d46b';for(const c of clouds){const x=cloudX(c,w,t),y=c.y+Math.sin(t*.0002+c.p)*3,s=c.s;ctx.beginPath();ctx.ellipse(x,y,74*s,24*s,0,0,Math.PI*2);ctx.ellipse(x+46*s,y-11*s,45*s,28*s,0,0,Math.PI*2);ctx.ellipse(x-44*s,y-7*s,40*s,24*s,0,0,Math.PI*2);ctx.ellipse(x+8*s,y-18*s,37*s,27*s,0,0,Math.PI*2);ctx.fill()}}
function drawField(w,h,t){const horizon=h*.60,g=ctx.createLinearGradient(0,horizon,0,h);g.addColorStop(0,isDay?'#78aa58':'#29442f');g.addColorStop(.58,isDay?'#4d7b3d':'#1d3223');g.addColorStop(1,isDay?'#274d2a':'#0d1913');ctx.fillStyle=g;ctx.fillRect(0,horizon,w,h-horizon);ctx.fillStyle=isDay?'#608f48':'#213826';ctx.beginPath();ctx.moveTo(0,horizon+13);for(let x=0;x<=w;x+=58)ctx.lineTo(x,horizon-7-Math.sin(x*.009)*13-Math.sin(x*.021)*5);ctx.lineTo(w,horizon+25);ctx.lineTo(0,horizon+25);ctx.fill();const bend=Math.sin(windDir*Math.PI/180)*Math.min(14,wind*.42),gustWave=Math.min(7,Math.max(0,gust-wind)*.3);const layers=[{top:horizon+10,bottom:horizon+92,count:230,min:8,max:18,c:isDay?'#8dbd6b':'#3d6242'},{top:horizon+45,bottom:horizon+155,count:300,min:14,max:27,c:isDay?'#70a256':'#31513a'},{top:horizon+95,bottom:h-40,count:380,min:21,max:37,c:isDay?'#558542':'#25422f'},{top:horizon+155,bottom:h-2,count:460,min:29,max:48,c:isDay?'#3c7038':'#193424'}];for(let li=0;li<layers.length;li++){const L=layers[li];ctx.fillStyle=L.c;for(let i=0;i<L.count;i++){const u=(i*.61803398875+li*.17)%1;const v=(i*.41421356237+li*.29)%1;const x=u*w;const base=L.top+v*Math.max(1,L.bottom-L.top);const len=L.min+((i*17+li*11)%Math.max(1,L.max-L.min));const sw=bend*(.35+li*.18)+Math.sin(t*.0028+i*.23)*(1+li*.6)+Math.sin(t*.0011+i)*gustWave*.18;const width=.7+li*.55;ctx.beginPath();ctx.moveTo(x-width,base);ctx.quadraticCurveTo(x+sw*.32,base-len*.55,x+sw,base-len);ctx.quadraticCurveTo(x+sw*.52,base-len*.46,x+width,base);ctx.closePath();ctx.fill()}}}
function kiteCount(){if(!isDay||wind<4||wind>45)return 0;if(wind<9)return 1;if(wind<23)return 2;return 3}
function drawKites(w,h,t){const count=kiteCount(),theta=windDir*Math.PI/180,downX=-Math.sin(theta),gustBoost=Math.min(1,Math.max(0,gust-wind)/18);for(let i=0;i<count;i++){const k=kites[i],anchorX=w*(k.x-.06),anchorY=h*.80,baseX=w*k.x,baseY=h*k.y-(wind*1.05),bob=Math.sin(t*.0018+k.p)*(7+wind*.17),sway=downX*(18+wind*1.3)+(Math.sin(t*.0012+k.p)*7*(1+gustBoost));const x=baseX+sway,y=baseY+bob;ctx.strokeStyle='#ffffff99';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(anchorX,anchorY);ctx.quadraticCurveTo((anchorX+x)*.5-downX*18,anchorY-90-(wind*1.4),x,y+16);ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(downX*.15+Math.sin(t*.0018+k.p)*.09);ctx.fillStyle=k.c;ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(17,0);ctx.lineTo(0,20);ctx.lineTo(-17,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(0,20);ctx.moveTo(-17,0);ctx.lineTo(17,0);ctx.stroke();ctx.restore();ctx.strokeStyle=k.c;ctx.beginPath();for(let j=0;j<5;j++){const yy=y+22+j*10,xx=x+downX*(j*8)+Math.sin(t*.004+j+k.p)*3;if(j===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.stroke()}}
function drawNightParticles(w,h,t){if(isDay)return;const strength=Math.max(1,wind),sx=Math.sin(windDir*Math.PI/180),sy=-Math.cos(windDir*Math.PI/180);if(particles.length<Math.min(64,12+strength*1.25)){particles.push({x:Math.random()*w,y:h*.2+Math.random()*h*.68,v:.45+Math.random()*1.45,a:Math.random()*6.28,fire:wind<6&&Math.random()>.35,sz:3+Math.random()*4})}particles=particles.filter(p=>p.x>-90&&p.x<w+90&&p.y>-90&&p.y<h+90);for(const p of particles){p.x+=sx*strength*.035*p.v;p.y+=sy*strength*.016*p.v;p.a+=.04*p.v;if(p.fire){ctx.fillStyle='#eaff91';ctx.globalAlpha=.52+.38*Math.sin(t*.004+p.a);ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill()}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='#8a6a42cc';ctx.globalAlpha=.78;ctx.beginPath();ctx.moveTo(-p.sz*.5,0);ctx.quadraticCurveTo(0,-p.sz*.6,p.sz*.5,0);ctx.quadraticCurveTo(0,p.sz*.5,-p.sz*.5,0);ctx.fill();ctx.restore()}}ctx.globalAlpha=1}
function draw(t){const r=stage.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);drawSky(w,h);drawClouds(w,h,t);drawField(w,h,t);drawKites(w,h,t);drawNightParticles(w,h,t);requestAnimationFrame(draw)}
async function loadCatalog(){try{catalog=await fetch('https://raw.githubusercontent.com/bennessism/window/main/weather/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()})}catch(e){catalog={default:{country:'my',location:'selangor'},countries:{my:{name:'Malaysia',locations:[{id:'selangor',name:'Selangor',city:'Shah Alam',lat:3.0738,lon:101.5183}]}}}}populateCountries()}
function populateCountries(){countrySelect.innerHTML='';Object.entries(catalog.countries).forEach(([id,c])=>{const o=document.createElement('option');o.value=id;o.textContent=c.name;countrySelect.append(o)});countrySelect.value=localStorage.getItem('windCountry')||catalog.default.country||'my';if(!catalog.countries[countrySelect.value])countrySelect.value=Object.keys(catalog.countries)[0];populateLocations()}
function populateLocations(){locationSelect.innerHTML='';const c=catalog.countries[countrySelect.value];c.locations.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.name+(l.city&&l.city!==l.name?' · '+l.city:'');locationSelect.append(o)});const saved=localStorage.getItem('windLocation')||catalog.default.location;if(c.locations.some(l=>l.id===saved))locationSelect.value=saved}
function selectedLocation(){const c=catalog.countries[countrySelect.value];return c.locations.find(l=>l.id===locationSelect.value)||c.locations[0]}
async function loadWind(lat=currentLat,lon=currentLon,label=currentPlace){currentLat=lat;currentLon=lon;currentPlace=label;placeEl.textContent=label;statusEl.textContent='Updating live wind…';try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&wind_speed_unit=kmh&timezone=auto`;const j=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()});wind=Number(j.current.wind_speed_10m)||0;gust=Number(j.current.wind_gusts_10m)||wind;windDir=Number(j.current.wind_direction_10m)||0;isDay=Number(j.current.is_day)===1;speedEl.textContent=Math.round(wind);gustEl.textContent=Math.round(gust)+' km/h';dirEl.textContent='From '+compassName(windDir);phaseEl.textContent=isDay?'Day':'Night';arrow.style.transform=`translate(-50%,-100%) rotate(${windDir}deg)`;document.querySelector('meta[name="theme-color"]').content=isDay?'#76b7e8':'#07111f';statusEl.textContent=`Wind from ${compassName(windDir)} · ${Math.round(windDir)}°`;seedScene(stage.clientWidth,stage.clientHeight)}catch(e){statusEl.textContent='Using demo wind · live data unavailable';placeEl.textContent=label+' · demo'}}
function labelFor(loc){return loc.city&&loc.city!==loc.name?`${loc.name} · ${loc.city}`:loc.name}
function useBrowserLocation(){if(!navigator.geolocation){statusEl.textContent='Location not available';return}statusEl.textContent='Requesting location…';navigator.geolocation.getCurrentPosition(p=>{pickerBack.classList.remove('show');loadWind(p.coords.latitude,p.coords.longitude,'Your location')},()=>{statusEl.textContent='Location denied'},{enableHighAccuracy:false,timeout:8000,maximumAge:600000})}
document.getElementById('locBtn').onclick=()=>pickerBack.classList.add('show');document.getElementById('pickerClose').onclick=()=>pickerBack.classList.remove('show');pickerBack.onclick=e=>{if(e.target===pickerBack)pickerBack.classList.remove('show')};countrySelect.onchange=populateLocations;document.getElementById('myLocationBtn').onclick=useBrowserLocation;document.getElementById('applyLocationBtn').onclick=()=>{const loc=selectedLocation();localStorage.setItem('windCountry',countrySelect.value);localStorage.setItem('windLocation',loc.id);pickerBack.classList.remove('show');loadWind(loc.lat,loc.lon,labelFor(loc))};document.getElementById('refreshBtn').onclick=()=>loadWind();
scroller.addEventListener('scroll',()=>{if(innerWidth>700)return;const i=Math.max(0,Math.min(2,Math.round(scroller.scrollLeft/innerWidth)));document.querySelectorAll('.dots i').forEach((d,n)=>d.classList.toggle('on',n===i))},{passive:true});
addEventListener('resize',resize);resize();requestAnimationFrame(draw);loadCatalog().then(()=>{const loc=selectedLocation();loadWind(loc.lat,loc.lon,labelFor(loc))});setInterval(()=>loadWind(),10*60*1000);
</script>
</body>
</html>
