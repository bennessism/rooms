<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#76b7e8">
<title>Wind Field</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#82bfe9;color:#fff}button,select{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;overflow:hidden}#scroller{position:absolute;inset:0;overflow:hidden}#stage{position:relative;width:100vw;height:100vh;min-height:480px}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:20;display:flex;gap:10px;align-items:stretch;pointer-events:none}.card{background:#0b1722a8;border:1px solid #ffffff2b;box-shadow:0 12px 35px #0002;backdrop-filter:blur(12px);border-radius:18px}.weather{min-width:190px;padding:12px 14px}.place{font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.speed{font-size:29px;font-weight:760;line-height:1.05;margin-top:4px}.sub{font-size:12px;opacity:.82;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}.compass{width:94px;height:94px;position:relative;display:grid;place-items:center}.compass span{position:absolute;font-size:10px;font-weight:700;opacity:.8}.n{top:7px}.s{bottom:7px}.e{right:8px}.w{left:8px}.dial{width:48px;height:48px;border:1px solid #ffffff55;border-radius:50%;position:relative}.arrow{position:absolute;left:50%;top:50%;width:3px;height:22px;background:#fff;border-radius:3px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);box-shadow:0 0 8px #fff8}.arrow:before{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid #fff}.centerDot{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.controls{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:25;display:flex;gap:8px}.controls button{border:1px solid #ffffff2b;background:#0b1722a8;backdrop-filter:blur(12px);border-radius:999px;padding:10px 13px;cursor:pointer}.controls button:active{transform:scale(.97)}.status{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;padding:8px 12px;border-radius:999px;background:#0b172294;border:1px solid #ffffff22;backdrop-filter:blur(10px);font-size:11px;letter-spacing:.03em;opacity:.9;white-space:nowrap}.dots{display:none}
.pickerBack{position:fixed;inset:0;z-index:80;background:#06101db8;display:none;place-items:center;padding:20px;backdrop-filter:blur(8px)}.pickerBack.show{display:grid}.picker{width:min(440px,100%);background:#142230f2;border:1px solid #ffffff24;border-radius:22px;padding:18px;box-shadow:0 24px 70px #0005}.pickerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pickerTitle{font-weight:700}.pickerClose{width:36px;height:36px;border:1px solid #ffffff22;border-radius:50%;background:#ffffff0d;cursor:pointer}.fieldLabel{font-size:11px;opacity:.7;margin:12px 0 6px}.picker select{width:100%;padding:11px 12px;border:1px solid #ffffff22;border-radius:12px;background:#0b1722;color:#fff;outline:none}.pickerActions{display:flex;gap:8px;margin-top:16px}.pickerActions button{flex:1;border:1px solid #ffffff24;background:#ffffff12;border-radius:12px;padding:11px;cursor:pointer}.pickerActions .primary{background:#ffffffea;color:#10202d;font-weight:700}.catalogNote{font-size:10px;opacity:.55;margin-top:11px;text-align:center}
@media(max-width:700px){#scroller{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}#stage{width:300vw}.panelSnap{position:absolute;top:0;bottom:0;width:100vw;scroll-snap-align:start;pointer-events:none}.p1{left:0}.p2{left:100vw}.p3{left:200vw}.hud{right:10px;top:10px;gap:6px}.weather{min-width:145px;padding:9px 10px}.speed{font-size:22px}.sub{font-size:10px;gap:7px}.place{max-width:150px}.compass{width:78px;height:78px}.dial{width:40px;height:40px}.arrow{height:18px}.controls{left:10px;top:10px}.controls button{padding:9px 11px;font-size:12px}.status{bottom:30px;font-size:10px}.dots{display:flex;position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;gap:7px}.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#ffffff66}.dots i.on{background:#fff}}
</style>
</head>
<body>
<div id="viewport">
  <div id="scroller"><div id="stage"><canvas id="scene"></canvas><div class="panelSnap p1"></div><div class="panelSnap p2"></div><div class="panelSnap p3"></div></div></div>
  <div class="controls"><button id="locBtn">⌖ Location</button><button id="refreshBtn" aria-label="Refresh wind">↻</button></div>
  <div class="hud"><div class="card weather"><div class="place" id="place">Loading wind…</div><div class="speed"><span id="speed">--</span> <small style="font-size:13px;font-weight:500">km/h</small></div><div class="sub"><span id="dirText">--</span><span>Gust <b id="gust">--</b></span><span id="phase">--</span></div></div><div class="card compass"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><div class="dial"><div class="arrow" id="arrow"></div><div class="centerDot"></div></div></div></div>
  <div class="status" id="status">Live wind drives the field</div><div class="dots"><i class="on"></i><i></i><i></i></div>
</div>
<div class="pickerBack" id="pickerBack"><div class="picker"><div class="pickerHead"><div class="pickerTitle">Choose location</div><button class="pickerClose" id="pickerClose">×</button></div><div class="fieldLabel">Country</div><select id="countrySelect"></select><div class="fieldLabel">Location</div><select id="locationSelect"></select><div class="pickerActions"><button id="myLocationBtn">◎ My location</button><button class="primary" id="applyLocationBtn">Use location</button></div><div class="catalogNote">Location list shared with BENNESSism Window</div></div></div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),scroller=document.getElementById('scroller');
const speedEl=document.getElementById('speed'),gustEl=document.getElementById('gust'),dirEl=document.getElementById('dirText'),phaseEl=document.getElementById('phase'),placeEl=document.getElementById('place'),arrow=document.getElementById('arrow'),statusEl=document.getElementById('status');
const pickerBack=document.getElementById('pickerBack'),countrySelect=document.getElementById('countrySelect'),locationSelect=document.getElementById('locationSelect');
let wind=12,gust=18,windDir=250,isDay=true,turbineAngle=0,last=performance.now(),particles=[],stars=[],kites=[],clouds=[],catalog=null;
let currentLat=3.0738,currentLon=101.5183,currentPlace='Selangor · Shah Alam';
const DPR=()=>Math.min(devicePixelRatio||1,2);
function resize(){const r=stage.getBoundingClientRect(),d=DPR();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);seedScene(r.width,r.height)}
function seedScene(w,h){stars=Array.from({length:115},()=>({x:Math.random()*w,y:Math.random()*h*.58,r:.35+Math.random()*1.2,a:.28+Math.random()*.72}));clouds=Array.from({length:7},(_,i)=>({x:(i/7)*w+Math.random()*230,y:45+Math.random()*165,s:.62+Math.random()*1.2,p:Math.random()*6.28}));kites=[{x:.57,y:.30,c:'#ff5b67',p:0},{x:.72,y:.23,c:'#ffd54a',p:2.1},{x:.85,y:.34,c:'#4ad1c8',p:4.2}];particles=[]}
function compassName(deg){const n=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return n[Math.round((deg%360)/22.5)%16]}
function skyColors(){return isDay?['#6fb4e8','#d9efff','#f3d6a4']:['#06101d','#132640','#263a53']}
function drawSky(w,h){const c=skyColors(),g=ctx.createLinearGradient(0,0,0,h*.72);g.addColorStop(0,c[0]);g.addColorStop(.66,c[1]);g.addColorStop(1,c[2]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(!isDay){ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowColor='#fff4c777';ctx.shadowBlur=18;ctx.fillStyle='#f5efcf';ctx.beginPath();ctx.arc(w*.82,h*.145,27,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}else{ctx.fillStyle='#fff8c6';ctx.globalAlpha=.83;ctx.beginPath();ctx.arc(w*.84,h*.13,34,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function cloudX(c,w,t){const sign=Math.sin(windDir*Math.PI/180)>=0?1:-1,drift=sign*Math.max(3.2,wind*.16);return ((c.x+t*drift*.003)%(w+360)+w+360)%(w+360)-180}
function drawClouds(w,h,t){ctx.fillStyle=isDay?'#ffffffaa':'#bac8d456';for(const c of clouds){const x=cloudX(c,w,t),y=c.y+Math.sin(t*.0002+c.p)*3,s=c.s;ctx.beginPath();ctx.ellipse(x,y,74*s,24*s,0,0,Math.PI*2);ctx.ellipse(x+46*s,y-11*s,45*s,28*s,0,0,Math.PI*2);ctx.ellipse(x-44*s,y-7*s,40*s,24*s,0,0,Math.PI*2);ctx.ellipse(x+8*s,y-18*s,37*s,27*s,0,0,Math.PI*2);ctx.fill()}}
function grassBlade(x,base,len,bend,width,color,t,phase){const sway=Math.sin(t*.0026+phase)*Math.min(7,1+wind*.18),tipX=x+bend+sway;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x-width*.5,base);ctx.quadraticCurveTo(x+bend*.22,base-len*.55,tipX,base-len);ctx.quadraticCurveTo(x+bend*.48,base-len*.48,x+width*.5,base);ctx.closePath();ctx.fill()}
function drawField(w,h,t){const horizon=h*.60,g=ctx.createLinearGradient(0,horizon,0,h);g.addColorStop(0,isDay?'#76a857':'#29432e');g.addColorStop(.58,isDay?'#4d7b3d':'#1d3223');g.addColorStop(1,isDay?'#274d2a':'#0d1913');ctx.fillStyle=g;ctx.fillRect(0,horizon,w,h-horizon);ctx.fillStyle=isDay?'#608f48':'#213826';ctx.beginPath();ctx.moveTo(0,horizon+13);for(let x=0;x<=w;x+=58)ctx.lineTo(x,horizon-7-Math.sin(x*.009)*13-Math.sin(x*.021)*5);ctx.lineTo(w,horizon+25);ctx.lineTo(0,horizon+25);ctx.fill();const dirBend=Math.sin(windDir*Math.PI/180)*Math.min(17,wind*.46);const layers=[{start:horizon+20,step:18,len:14,w:1.8,c:isDay?'#88b867':'#36593b'},{start:horizon+48,step:13,len:22,w:2.4,c:isDay?'#6da052':'#294a32'},{start:horizon+92,step:9,len:31,w:3.0,c:isDay?'#4e813f':'#203a29'},{start:horizon+145,step:7,len:39,w:3.6,c:isDay?'#396d37':'#172f21'}];for(let li=0;li<layers.length;li++){const L=layers[li];for(let x=(li*4)%L.step;x<w;x+=L.step){const jitter=((x*37+li*19)%31),base=Math.min(h-2,L.start+jitter+((x*13)%Math.max(20,h-L.start-5))),len=L.len+((x*11+li*7)%14);grassBlade(x,base,len,dirBend*(.45+li*.18),L.w,L.c,t,x*.07+li)}}}
function drawTurbine(w,h,t){const mobile=innerWidth<=700,cx=w*(mobile?1/6:.145),ground=h*.82,hubY=h*.315,scale=Math.min(w/(mobile?800:1280),h/690);ctx.save();ctx.translate(cx,hubY);const towerGrad=ctx.createLinearGradient(-24*scale,0,24*scale,0);towerGrad.addColorStop(0,isDay?'#c8d0d5':'#7f8a94');towerGrad.addColorStop(.45,isDay?'#f1f4f5':'#b5bec5');towerGrad.addColorStop(1,isDay?'#b4bec5':'#6f7b86');ctx.fillStyle=towerGrad;ctx.beginPath();ctx.moveTo(-7*scale,7*scale);ctx.lineTo(-27*scale,ground-hubY);ctx.lineTo(29*scale,ground-hubY);ctx.lineTo(8*scale,7*scale);ctx.closePath();ctx.fill();ctx.fillStyle=isDay?'#dce3e7':'#8d99a3';ctx.beginPath();ctx.roundRect(-13*scale,-12*scale,55*scale,24*scale,8*scale);ctx.fill();ctx.fillStyle=isDay?'#c8d1d7':'#7d8993';ctx.beginPath();ctx.moveTo(37*scale,-8*scale);ctx.lineTo(49*scale,-4*scale);ctx.lineTo(49*scale,5*scale);ctx.lineTo(37*scale,8*scale);ctx.closePath();ctx.fill();const targetSpeed=Math.min(.048,.0055+wind*.001);turbineAngle+=targetSpeed*(t-last);ctx.rotate(turbineAngle);for(let i=0;i<3;i++){ctx.save();ctx.rotate(i*Math.PI*2/3);const bladeGrad=ctx.createLinearGradient(0,0,155*scale,0);bladeGrad.addColorStop(0,isDay?'#dbe2e6':'#9ba6ae');bladeGrad.addColorStop(.28,isDay?'#f8f9f9':'#c8d1d7');bladeGrad.addColorStop(1,isDay?'#e8edef':'#aeb9c0');ctx.fillStyle=bladeGrad;ctx.beginPath();ctx.moveTo(5*scale,-5*scale);ctx.bezierCurveTo(47*scale,-13*scale,108*scale,-19*scale,157*scale,-8*scale);ctx.bezierCurveTo(132*scale,-1*scale,92*scale,5*scale,16*scale,12*scale);ctx.bezierCurveTo(8*scale,9*scale,5*scale,3*scale,5*scale,-5*scale);ctx.closePath();ctx.fill();ctx.restore()}ctx.fillStyle=isDay?'#b9c4ca':'#87949e';ctx.beginPath();ctx.arc(0,0,15*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle=isDay?'#e3e8eb':'#a7b0b7';ctx.beginPath();ctx.arc(0,0,8*scale,0,Math.PI*2);ctx.fill();ctx.restore();if(!isDay){ctx.fillStyle='#ff4b4b';ctx.globalAlpha=.8+.2*Math.sin(t*.005);ctx.beginPath();ctx.arc(cx+32*scale,hubY-15*scale,2.2*scale,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function kiteCount(){if(!isDay||wind<4||wind>45)return 0;if(wind<9)return 1;if(wind<23)return 2;return 3}
function drawKites(w,h,t){const count=kiteCount(),theta=windDir*Math.PI/180,downX=-Math.sin(theta),gustLift=Math.max(0,gust-wind);for(let i=0;i<count;i++){const k=kites[i],lift=Math.min(.08,.02+wind*.0018),baseX=w*k.x,baseY=h*(k.y-lift),flutter=Math.sin(t*.002+k.p)*(7+wind*.32)+Math.sin(t*.0043+k.p)*gustLift*.4,x=baseX+downX*flutter,y=baseY+Math.sin(t*.0017+k.p)*(6+wind*.18),anchorX=w*(k.x-.035),anchorY=h*.79;ctx.strokeStyle='#ffffff8c';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(anchorX,anchorY);ctx.quadraticCurveTo((anchorX+x)/2-downX*28,(anchorY+y)/2+18,x,y+15);ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.0024+k.p)*.13+downX*.08);ctx.fillStyle=k.c;ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(17,0);ctx.lineTo(0,20);ctx.lineTo(-17,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(0,20);ctx.moveTo(-17,0);ctx.lineTo(17,0);ctx.stroke();ctx.restore();ctx.strokeStyle=k.c;ctx.beginPath();ctx.moveTo(x,y+20);for(let j=1;j<=5;j++){ctx.lineTo(x+downX*j*7+Math.sin(t*.004+j+k.p)*4,y+20+j*9)}ctx.stroke()}}
function drawNightParticles(w,h,t){if(isDay)return;const strength=Math.max(1,wind),target=Math.min(58,10+strength*1.25);if(particles.length<target)particles.push({x:Math.random()*w,y:h*.2+Math.random()*h*.67,v:.45+Math.random()*1.6,a:Math.random()*6.28,fire:wind<6&&Math.random()>.4});const sx=Math.sin(windDir*Math.PI/180),sy=-Math.cos(windDir*Math.PI/180);particles=particles.filter(p=>p.x>-90&&p.x<w+90&&p.y>-90&&p.y<h+90);for(const p of particles){p.x+=sx*strength*.035*p.v;p.y+=sy*strength*.014*p.v;p.a+=.045*p.v;if(p.fire){ctx.fillStyle='#ecff9b';ctx.globalAlpha=.5+.35*Math.sin(t*.004+p.a);ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill()}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='#8c6c45cc';ctx.globalAlpha=.82;ctx.beginPath();ctx.ellipse(0,0,5,2.5,.4,0,Math.PI*2);ctx.fill();ctx.restore()}}ctx.globalAlpha=1}
function draw(t){const r=stage.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);drawSky(w,h);drawClouds(w,h,t);drawField(w,h,t);drawTurbine(w,h,t);drawKites(w,h,t);drawNightParticles(w,h,t);last=t;requestAnimationFrame(draw)}
async function loadWind(lat=currentLat,lon=currentLon,label=currentPlace){currentLat=lat;currentLon=lon;currentPlace=label;placeEl.textContent=label;statusEl.textContent='Updating live wind…';try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&wind_speed_unit=kmh&timezone=auto`;const j=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Weather unavailable');return r.json()});wind=Number(j.current.wind_speed_10m)||0;gust=Number(j.current.wind_gusts_10m)||wind;windDir=Number(j.current.wind_direction_10m)||0;isDay=Number(j.current.is_day)===1;speedEl.textContent=Math.round(wind);gustEl.textContent=Math.round(gust)+' km/h';dirEl.textContent='From '+compassName(windDir);phaseEl.textContent=isDay?'Day':'Night';arrow.style.transform=`translate(-50%,-100%) rotate(${windDir}deg)`;document.querySelector('meta[name="theme-color"]').content=isDay?'#76b7e8':'#07111f';statusEl.textContent=`Wind from ${compassName(windDir)} · ${Math.round(windDir)}°`;seedScene(stage.clientWidth,stage.clientHeight)}catch(e){statusEl.textContent='Using demo wind · live data unavailable';placeEl.textContent=label+' · demo'}}
async function loadCatalog(){try{catalog=await fetch('https://raw.githubusercontent.com/bennessism/window/main/weather/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()});countrySelect.innerHTML='';Object.entries(catalog.countries).forEach(([id,c])=>{const o=document.createElement('option');o.value=id;o.textContent=c.name;countrySelect.append(o)});countrySelect.value=catalog.default?.country||'my';fillLocations()}catch(e){statusEl.textContent='Location list unavailable'}}
function fillLocations(){if(!catalog)return;const c=catalog.countries[countrySelect.value];locationSelect.innerHTML='';(c?.locations||[]).forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.name+(l.city&&l.city!==l.name?' · '+l.city:'');o.dataset.lat=l.lat;o.dataset.lon=l.lon;o.dataset.city=l.city||l.name;locationSelect.append(o)});if(countrySelect.value===catalog.default?.country&&catalog.default?.location)locationSelect.value=catalog.default.location}
function openPicker(){pickerBack.classList.add('show')}function closePicker(){pickerBack.classList.remove('show')}
document.getElementById('locBtn').onclick=openPicker;document.getElementById('pickerClose').onclick=closePicker;pickerBack.addEventListener('click',e=>{if(e.target===pickerBack)closePicker()});countrySelect.onchange=fillLocations;
document.getElementById('applyLocationBtn').onclick=()=>{const c=catalog?.countries[countrySelect.value],o=locationSelect.selectedOptions[0];if(!c||!o)return;const label=o.textContent+' · '+c.name;loadWind(Number(o.dataset.lat),Number(o.dataset.lon),label);closePicker()};
document.getElementById('myLocationBtn').onclick=()=>{if(!navigator.geolocation){statusEl.textContent='Location not available';return}statusEl.textContent='Requesting location…';navigator.geolocation.getCurrentPosition(p=>{loadWind(p.coords.latitude,p.coords.longitude,'Your location');closePicker()},()=>statusEl.textContent='Location permission denied',{enableHighAccuracy:false,timeout:8000,maximumAge:600000})};
document.getElementById('refreshBtn').onclick=()=>loadWind();scroller.addEventListener('scroll',()=>{if(innerWidth>700)return;const i=Math.max(0,Math.min(2,Math.round(scroller.scrollLeft/innerWidth)));document.querySelectorAll('.dots i').forEach((d,n)=>d.classList.toggle('on',n===i))},{passive:true});
addEventListener('resize',resize);resize();requestAnimationFrame(draw);loadCatalog();loadWind();setInterval(()=>loadWind(),10*60*1000);
</script>
</body>
</html>
