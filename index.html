<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Rooms — Endless Corridor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#f4f1ea;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit}
#app,#world{position:absolute;inset:0}#world canvas{display:block;width:100%;height:100%}
.topbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;padding:8px 12px;border-radius:999px;background:#111b;border:1px solid #fff2;backdrop-filter:blur(10px);font-size:12px;letter-spacing:.06em;white-space:nowrap}
.hud{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;padding:8px;border-radius:18px;background:#111b;border:1px solid #fff2;backdrop-filter:blur(10px)}
.hud button,.roomClose{width:48px;height:48px;border:1px solid #fff2;border-radius:13px;background:#ffffff13;cursor:pointer;font-size:21px}.hud button:active,.roomClose:active{transform:scale(.94)}.hud button:disabled{opacity:.28;cursor:default}.meter{min-width:88px;text-align:center;font-size:12px;color:#ddd}
.notice{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:20;padding:7px 11px;border-radius:10px;background:#111a;border:1px solid #fff2;font-size:12px;opacity:0;transition:opacity .2s}.notice.show{opacity:1}
.fatal{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#171717;color:#eee;text-align:center;line-height:1.5}.fatal>div{max-width:520px;padding:20px;border:1px solid #ffffff22;border-radius:16px;background:#222}
#room{position:absolute;inset:0;z-index:40;display:none;background:#ddd;color:#111}#room.show{display:block}.roomScene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.roomClose{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:60;background:#1118;color:white}.roomLabel{position:absolute;left:18px;bottom:18px;z-index:60;padding:9px 12px;border-radius:11px;background:#1119;color:#fff;font-size:12px}
.gallery{background:linear-gradient(#eeeae2 0 72%,#77726a 72%)}.roomArts{display:flex;gap:clamp(12px,4vw,55px);width:88%;height:58%;align-items:center;justify-content:center}.roomArt{background:#fff;padding:7px;border:7px solid #292724;box-shadow:0 15px 35px #0004}.roomArt canvas{width:100%;height:100%;display:block}.colorRoom{animation:colors 14s linear infinite alternate}@keyframes colors{0%{background:#ec9aa8}25%{background:#90bcc7}50%{background:#d9c178}75%{background:#927fb4}100%{background:#86b68d}}.darkRoom{background:radial-gradient(circle,#322a46,#08080d 72%)}.lightRoom{background:linear-gradient(135deg,#fff,#e9e6df)}.rainRoom{background:linear-gradient(#2b3942,#12191e)}.window{width:min(76vw,850px);height:min(62vh,580px);border:14px solid #292d2f;background:linear-gradient(#314855,#17242d);position:relative;overflow:hidden}.window::before{content:"";position:absolute;inset:-80px;background:repeating-linear-gradient(105deg,transparent 0 22px,#d6edf266 23px 24px,transparent 25px 48px);animation:rain .6s linear infinite}@keyframes rain{to{transform:translate(-25px,70px)}}.plantRoom{background:linear-gradient(#d9e3d3 0 72%,#8a765e 72%)}.plant{position:absolute;bottom:8%;font-size:clamp(60px,10vw,130px)}.plant.p1{left:8%}.plant.p2{right:8%;transform:scale(.8)}.plant.p3{left:37%;transform:scale(.55)}.mirrorRoom{background:linear-gradient(120deg,#99a3a8,#edf2f2 30%,#7d888d 49%,#eef2f3 72%,#949da2)}.floatRoom{background:radial-gradient(circle,#d8d0e8,#746e88)}.shape{position:absolute;width:85px;height:85px;background:#ffffff55;border:1px solid #fff8;animation:drift 9s ease-in-out infinite alternate}.shape:nth-child(2n){border-radius:50%}.shape:nth-child(3n){border-radius:35% 65% 55% 45%}@keyframes drift{to{transform:translate(65px,-85px) rotate(140deg)}}.sculptRoom{background:linear-gradient(#e8e5dd 0 73%,#78736a 73%)}.sculpt{width:min(34vw,330px);aspect-ratio:1;border-radius:37% 63% 45% 55%/56% 35% 65% 44%;background:linear-gradient(135deg,#25252b,#aaa5b6 48%,#303039);box-shadow:0 28px 50px #0005}.tinyRoom{background:#d8d1c5}.tinyBox{width:min(58vw,420px);height:min(54vh,390px);background:#f2eee7;border:18px solid #8d8172;box-shadow:0 20px 50px #0004;display:grid;place-items:center;font-size:56px}.hugeRoom{background:linear-gradient(#dbd7d0 0 80%,#5a5854 80%)}.emptyRoom{background:linear-gradient(#e8e3da 0 76%,#918b81 76%)}.soundRoom{background:radial-gradient(circle,#344151,#13171d)}.ring{position:absolute;width:100px;height:100px;border:2px solid #cfe3ff;border-radius:50%;animation:ring 3s ease-out infinite}.ring:nth-child(2){animation-delay:1s}.ring:nth-child(3){animation-delay:2s}@keyframes ring{to{transform:scale(6);opacity:0}}.ghostRoom{background:radial-gradient(circle,#504669,#15131d 72%)}.ghost{position:absolute;width:72px;height:92px;border-radius:52% 48% 42% 58%/43% 46% 54% 57%;background:#eef4ffbf;box-shadow:0 0 24px #c7d7ff77;animation:floatg 4s ease-in-out infinite alternate}.ghost::before,.ghost::after{content:"";position:absolute;top:34%;width:8px;height:11px;border-radius:50%;background:#262437}.ghost::before{left:27%}.ghost::after{right:27%}.ghost span{position:absolute;left:0;right:0;bottom:-20px;height:42px;background:inherit;clip-path:polygon(0 0,18% 45%,34% 8%,50% 58%,67% 12%,82% 52%,100% 0,100% 100%,0 100%)}@keyframes floatg{to{transform:translateY(-24px) rotate(4deg)}}
@media(max-width:700px){.hud button{width:44px;height:44px}.hud{gap:6px}.meter{min-width:72px}.topbar{font-size:11px}}
</style>
</head>
<body>
<div id="app">
  <div id="world"></div>
  <div class="topbar" id="topbar">ENDLESS CORRIDOR · HALL 1</div>
  <div class="notice" id="notice"></div>
  <div class="hud">
    <button id="turnL" aria-label="Turn left" disabled>↶</button>
    <button id="walk" aria-label="Walk forward">↑</button>
    <button id="turnR" aria-label="Turn right" disabled>↷</button>
    <div class="meter" id="meter">0.0 m</div>
  </div>
  <section id="room" aria-hidden="true"><button class="roomClose" id="roomClose">×</button><div class="roomScene" id="roomScene"></div><div class="roomLabel" id="roomLabel"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" onerror="document.getElementById('world').innerHTML='<div class=&quot;fatal&quot;><div>3D engine failed to load.<br>Please refresh the page.</div></div>'"></script>
<script>
if(typeof THREE==='undefined'){document.getElementById('world').innerHTML='<div class="fatal"><div>3D engine failed to load.<br>Please refresh the page.</div></div>';throw new Error('Three.js failed to load');}
const TYPES=['gallery','one','color','mirror','float','rain','plant','dark','light','sound','sculpture','tiny','huge','empty','corridor','ghost'];
const LABELS={gallery:'Mini Gallery Room',one:'One Painting Room',color:'Color Room',mirror:'Mirror Room',float:'Floating Shapes Room',rain:'Rain Room',plant:'Plant Room',dark:'Dark Gallery',light:'Light Room',sound:'Sound Room',sculpture:'Sculpture Room',tiny:'Tiny Room',huge:'Huge Hall',empty:'Empty Room',corridor:'Another Corridor',ghost:'Ghost Room'};
const HALL=54, STEP=.55, seed=(Date.now()>>>0)%2147483647;
let hall=1, pos=1.4, total=0, targetPos=1.4, walking=false, turnReady=false, turnSide=1, activeDoor=null;
const world=document.querySelector('#world'),meter=document.querySelector('#meter'),topbar=document.querySelector('#topbar'),notice=document.querySelector('#notice'),leftBtn=document.querySelector('#turnL'),rightBtn=document.querySelector('#turnR');
function hash(n){n=(n^61)^(n>>>16);n+=(n<<3);n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return n>>>0}function rnd(n,s=0){return(hash(seed+n*977+s*131)%10000)/10000}
function palette(n){const p=[['#e95f67','#f3c969','#4e8ea6','#25364a'],['#6c63a8','#cf8fb3','#78b7a4','#f1d590'],['#22223b','#4a4e69','#9a8c98','#c9ada7'],['#ef8354','#4f5d75','#bfc0c0','#2d3142'],['#2a9d8f','#e9c46a','#f4a261','#e76f51']];return p[hash(n)%p.length]}
function drawArtCanvas(n){const c=document.createElement('canvas');c.width=320;c.height=220;const x=c.getContext('2d'),p=palette(n);x.fillStyle=p[3];x.fillRect(0,0,c.width,c.height);for(let i=0;i<22;i++){x.globalAlpha=.28+rnd(n,i)*.65;x.fillStyle=p[i%p.length];x.beginPath();if(i%3===0){x.arc(rnd(i,n)*c.width,rnd(n,i+9)*c.height,15+rnd(n+4,i)*80,0,Math.PI*2);x.fill()}else{x.save();x.translate(rnd(n,i+3)*c.width,rnd(i+7,n)*c.height);x.rotate(rnd(n+9,i)*Math.PI);x.fillRect(-55,-15,110+rnd(i,n)*90,20+rnd(n,i)*55);x.restore()}}x.globalAlpha=1;return c}

const scene=new THREE.Scene();scene.background=new THREE.Color(0x111111);scene.fog=new THREE.Fog(0xddd8ce,22,62);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,100);camera.position.set(0,1.68,pos);camera.lookAt(0,1.65,pos+10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;world.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf4efe5,0x4a4742,1.65));
const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(0,7,8);scene.add(sun);
const hallGroup=new THREE.Group();scene.add(hallGroup);
let doors=[];
const matWall=new THREE.MeshStandardMaterial({color:0xe5e0d7,roughness:.88});const matFloor=new THREE.MeshStandardMaterial({color:0x756f67,roughness:.95});const matCeil=new THREE.MeshStandardMaterial({color:0xd9d5cd,roughness:.9});
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);hallGroup.add(m);return m}
function addFrame(side,z,n){const tex=new THREE.CanvasTexture(drawArtCanvas(n));tex.colorSpace=THREE.SRGBColorSpace;const artMat=new THREE.MeshBasicMaterial({map:tex});const frame=box(2.25,1.65,.12,new THREE.MeshStandardMaterial({color:0x292724}),side*3.92,2.15,z);const art=new THREE.Mesh(new THREE.PlaneGeometry(1.98,1.38),artMat);art.position.set(side*3.845,2.15,z);art.rotation.y=side<0?Math.PI/2:-Math.PI/2;hallGroup.add(art);frame.scale.x=.08;}
function doorColor(type){return {plant:0x496b50,rain:0x607889,dark:0x24252b,light:0xe9e5dc,ghost:0x5b5276,color:0xb96aa9,mirror:0xaab4b8}[type]||0x806a52}
function addDoor(side,z,index){const type=TYPES[hash(hall*100+index)%TYPES.length];const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.18,2.6,1.35),new THREE.MeshStandardMaterial({color:doorColor(type),roughness:.72,metalness:type==='mirror'?.5:.02}));body.position.set(side*3.88,1.3,z);g.add(body);const knob=new THREE.Mesh(new THREE.SphereGeometry(.055,12,12),new THREE.MeshStandardMaterial({color:0xd9b86b,metalness:.7,roughness:.25}));knob.position.set(side*3.72,1.35,z+(side<0?.38:-.38));g.add(knob);hallGroup.add(g);doors.push({group:g,z,type,index,side});}
function buildHall(){while(hallGroup.children.length)hallGroup.remove(hallGroup.children[0]);doors=[];box(8,3.8,.22,matWall,0,1.9,HALL+.12);box(.22,3.8,HALL,matWall,-4,1.9,HALL/2);box(.22,3.8,HALL,matWall,4,1.9,HALL/2);box(8,.22,HALL,matFloor,0,-.11,HALL/2);box(8,.18,HALL,matCeil,0,3.82,HALL/2);
for(let z=5,i=0;z<HALL-5;z+=4.8,i++){const side=i%2?-1:1;if(i%3===1)addDoor(side,z,i);else addFrame(side,z,i+hall*31);if(i%4===0)addFrame(-side,z+1.6,i+hall*47)}
turnSide=rnd(hall,91)>.5?1:-1;const sideWall=box(4,.02,7,new THREE.MeshStandardMaterial({color:0xcfcac1}),turnSide*2,1.9,HALL+3.2);sideWall.rotation.z=Math.PI/2;}
buildHall();
function setNotice(t){notice.textContent=t;notice.classList.add('show');clearTimeout(setNotice.t);setNotice.t=setTimeout(()=>notice.classList.remove('show'),1300)}
function nearestDoor(){let best=null,bd=99;for(const d of doors){const dd=Math.abs(d.z-pos);if(dd<bd){bd=dd;best=d}}return bd<1.15?best:null}
function updateDoorState(){activeDoor=nearestDoor();renderer.domElement.style.cursor=activeDoor?'pointer':'default';if(activeDoor)setNotice('Door nearby · tap/click to enter')}
function stepForward(){if(document.querySelector('#room').classList.contains('show')||turnReady)return;targetPos=Math.min(HALL-1.6,targetPos+STEP);walking=true;}
function completeTurn(){hall++;pos=1.4;targetPos=1.4;total+=2;turnReady=false;leftBtn.disabled=rightBtn.disabled=true;buildHall();topbar.textContent='ENDLESS CORRIDOR · HALL '+hall;camera.position.set(0,1.68,pos);camera.rotation.set(0,0,0);}
leftBtn.onclick=()=>{if(turnReady&&turnSide<0)completeTurn()};rightBtn.onclick=()=>{if(turnReady&&turnSide>0)completeTurn()};
const walkBtn=document.querySelector('#walk');walkBtn.onclick=stepForward;let hold;walkBtn.onpointerdown=()=>{clearInterval(hold);hold=setInterval(stepForward,180)};['pointerup','pointerleave','pointercancel'].forEach(e=>walkBtn.addEventListener(e,()=>clearInterval(hold)));
renderer.domElement.addEventListener('click',()=>{const d=nearestDoor();if(d)openRoom(d.type,d.index+hall*100)});
document.addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key)){e.preventDefault();stepForward()}if(e.key==='ArrowLeft'&&!leftBtn.disabled)leftBtn.click();if(e.key==='ArrowRight'&&!rightBtn.disabled)rightBtn.click();if(e.key==='Escape')closeRoom()});
let sy=0;renderer.domElement.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});renderer.domElement.addEventListener('touchend',e=>{if(sy-e.changedTouches[0].clientY>30)stepForward()},{passive:true});
function animate(){requestAnimationFrame(animate);if(walking){pos+=(targetPos-pos)*.18;if(Math.abs(targetPos-pos)<.01){pos=targetPos;walking=false;updateDoorState()}camera.position.z=pos;camera.position.y=1.68+Math.sin(pos*4.4)*.015;total=Math.max(total,pos-1.4);meter.textContent=total.toFixed(1)+' m';if(pos>=HALL-1.75&&!turnReady){turnReady=true;walking=false;targetPos=pos;leftBtn.disabled=turnSide>0;rightBtn.disabled=turnSide<0;setNotice('The corridor bends '+(turnSide<0?'left':'right'))}}
renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

function roomArt(sceneEl,n,count=3){const wrap=document.createElement('div');wrap.className='roomArts';for(let i=0;i<count;i++){const d=document.createElement('div');d.className='roomArt';d.style.width=count===1?'min(58vw,620px)':'min(24vw,280px)';d.style.height=count===1?'min(58vh,520px)':'min(42vh,360px)';const c=drawArtCanvas(n+i*9);d.append(c);wrap.append(d)}sceneEl.append(wrap)}
function ghosts(sceneEl,n,count){for(let i=0;i<count;i++){const g=document.createElement('div');g.className='ghost';g.style.left=(8+rnd(n,i)*78)+'%';g.style.top=(10+rnd(i,n)*62)+'%';g.style.transform=`scale(${.6+rnd(n+4,i)})`;g.innerHTML='<span></span>';sceneEl.append(g)}}
function openRoom(type,n){if(type==='corridor'){completeTurn();return}const room=document.querySelector('#room'),s=document.querySelector('#roomScene');s.className='roomScene';s.innerHTML='';document.querySelector('#roomLabel').textContent=LABELS[type]+' · Door '+n;if(type==='gallery'){s.classList.add('gallery');roomArt(s,n,4)}if(type==='one'){s.classList.add('gallery');roomArt(s,n,1)}if(type==='color')s.classList.add('colorRoom');if(type==='mirror')s.classList.add('mirrorRoom');if(type==='float'){s.classList.add('floatRoom');for(let i=0;i<11;i++){let q=document.createElement('div');q.className='shape';q.style.left=rnd(n,i)*90+'%';q.style.top=rnd(i,n)*80+'%';s.append(q)}}if(type==='rain'){s.classList.add('rainRoom');let w=document.createElement('div');w.className='window';s.append(w)}if(type==='plant'){s.classList.add('plantRoom');['🪴','🌿','🌱'].forEach((x,i)=>{let p=document.createElement('div');p.className='plant p'+(i+1);p.textContent=x;s.append(p)});roomArt(s,n,2)}if(type==='dark'){s.classList.add('darkRoom');roomArt(s,n,3);ghosts(s,n,1)}if(type==='light'){s.classList.add('lightRoom');roomArt(s,n,2)}if(type==='sound'){s.classList.add('soundRoom');for(let i=0;i<3;i++){let r=document.createElement('div');r.className='ring';s.append(r)}}if(type==='sculpture'){s.classList.add('sculptRoom');let q=document.createElement('div');q.className='sculpt';s.append(q)}if(type==='tiny'){s.classList.add('tinyRoom');let q=document.createElement('div');q.className='tinyBox';q.textContent='🪑';s.append(q)}if(type==='huge')s.classList.add('hugeRoom');if(type==='empty')s.classList.add('emptyRoom');if(type==='ghost'){s.classList.add('ghostRoom');ghosts(s,n,5+hash(n)%6)}room.classList.add('show');room.setAttribute('aria-hidden','false')}
function closeRoom(){const r=document.querySelector('#room');r.classList.remove('show');r.setAttribute('aria-hidden','true')}document.querySelector('#roomClose').onclick=closeRoom;
</script>
</body>
</html>
