<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#76b7e8">
<title>Wind Field</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#82bfe9;color:#fff}button,select{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;overflow:hidden}#scroller{position:absolute;inset:0;overflow:hidden}#stage{position:relative;width:100vw;height:100vh;min-height:480px}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.summary{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:35;border:1px solid #ffffff26;background:#0b17229e;box-shadow:0 10px 28px #0002;backdrop-filter:blur(12px);border-radius:15px;padding:10px 13px;cursor:pointer;text-align:left}.summaryLine{font-size:13px;font-weight:620;white-space:nowrap}.summary:active{transform:scale(.98)}
.overlay{position:fixed;inset:0;z-index:80;background:#06101db8;display:none;place-items:center;padding:20px;backdrop-filter:blur(8px)}.overlay.show{display:grid}.panel{width:min(410px,100%);background:#142230f4;border:1px solid #ffffff24;border-radius:22px;padding:18px;box-shadow:0 24px 70px #0005}.panelHead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.panelLoc{font-size:14px;font-weight:700}.condition{font-size:13px;opacity:.76;margin-top:2px}.panelClose{width:36px;height:36px;border:1px solid #ffffff22;border-radius:50%;background:#ffffff0d;cursor:pointer}.primaryValue{display:flex;align-items:flex-end;gap:7px;margin-top:17px}.primaryValue strong{font-size:44px;line-height:.95}.primaryValue span{font-size:14px;opacity:.78;padding-bottom:4px}.from{font-size:14px;margin-top:7px;opacity:.88}.rows{margin-top:17px;border-top:1px solid #ffffff18}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid #ffffff12;font-size:13px}.row span:first-child{opacity:.68}.updated{font-size:11px;opacity:.55;margin-top:12px}.changeBtn{width:100%;margin-top:12px;border:1px solid #ffffff24;background:#ffffffea;color:#10202d;border-radius:12px;padding:11px;font-weight:700;cursor:pointer}.refreshBtn{margin-top:8px;width:100%;border:1px solid #ffffff1f;background:#ffffff0b;border-radius:12px;padding:9px;color:#fff;cursor:pointer}.picker{display:none;margin-top:15px;padding-top:14px;border-top:1px solid #ffffff18}.picker.show{display:block}.fieldLabel{font-size:11px;opacity:.7;margin:10px 0 6px}.picker select{width:100%;padding:11px 12px;border:1px solid #ffffff22;border-radius:12px;background:#0b1722;color:#fff;outline:none}.pickerButtons{display:flex;gap:8px;margin-top:14px}.pickerButtons button{flex:1;border:1px solid #ffffff24;background:#ffffff12;border-radius:12px;padding:10px;cursor:pointer}.dots{display:none}
@media(max-width:700px){#scroller{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}#stage{width:300vw}.panelSnap{position:absolute;top:0;bottom:0;width:100vw;scroll-snap-align:start;pointer-events:none}.p1{left:0}.p2{left:100vw}.p3{left:200vw}.summary{top:10px;left:10px;padding:9px 11px}.summaryLine{font-size:12px}.dots{display:flex;position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;gap:7px}.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#ffffff66}.dots i.on{background:#fff}}
</style>
</head>
<body>
<div id="viewport">
  <div id="scroller"><div id="stage"><canvas id="scene"></canvas><div class="panelSnap p1"></div><div class="panelSnap p2"></div><div class="panelSnap p3"></div></div></div>
  <button class="summary" id="summaryBtn"><div class="summaryLine" id="summaryLine">Loading…</div></button>
  <div class="dots"><i class="on"></i><i></i><i></i></div>
</div>
<div class="overlay" id="detailBack"><div class="panel">
  <div class="panelHead"><div><div class="panelLoc" id="detailLoc">Loading…</div><div class="condition" id="condition">—</div></div><button class="panelClose" id="detailClose">×</button></div>
  <div class="primaryValue"><strong id="speed">--</strong><span>km/h</span></div>
  <div class="from" id="fromText">From --</div>
  <div class="rows"><div class="row"><span>Gust</span><strong id="gust">-- km/h</strong></div><div class="row"><span>Direction</span><strong id="direction">--°</strong></div></div>
  <div class="updated" id="updated">Updated --</div>
  <button class="changeBtn" id="changeLocationBtn">Change location</button>
  <button class="refreshBtn" id="refreshBtn">Refresh</button>
  <div class="picker" id="picker"><div class="fieldLabel">Country</div><select id="countrySelect"></select><div class="fieldLabel">Location</div><select id="locationSelect"></select><div class="pickerButtons"><button id="myLocationBtn">◎ My location</button><button id="applyLocationBtn">Use location</button></div></div>
</div></div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),scroller=document.getElementById('scroller');
const summaryLine=document.getElementById('summaryLine'),detailBack=document.getElementById('detailBack'),detailLoc=document.getElementById('detailLoc'),conditionEl=document.getElementById('condition'),speedEl=document.getElementById('speed'),gustEl=document.getElementById('gust'),fromText=document.getElementById('fromText'),directionEl=document.getElementById('direction'),updatedEl=document.getElementById('updated');
const picker=document.getElementById('picker'),countrySelect=document.getElementById('countrySelect'),locationSelect=document.getElementById('locationSelect');
let wind=12,gust=18,windDir=250,isDay=true,particles=[],stars=[],kites=[],clouds=[],catalog=null,currentLat=3.0738,currentLon=101.5183,currentPlace='Selangor · Shah Alam',currentArea='Selangor';
const DPR=()=>Math.min(devicePixelRatio||1,2);
function resize(){const r=stage.getBoundingClientRect(),d=DPR();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);seedScene(r.width,r.height)}
function seedScene(w,h){stars=Array.from({length:95},()=>({x:Math.random()*w,y:Math.random()*h*.58,r:.35+Math.random()*1.15,a:.28+Math.random()*.72}));clouds=Array.from({length:7},(_,i)=>({x:(i/7)*w+Math.random()*230,y:45+Math.random()*165,s:.62+Math.random()*1.2,p:Math.random()*6.28}));kites=[{x:.57,y:.30,c:'#ff5b67',p:0},{x:.72,y:.23,c:'#ffd54a',p:2.1},{x:.85,y:.34,c:'#4ad1c8',p:4.2}];particles=[]}
function compassName(deg){const n=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return n[Math.round((deg%360)/22.5)%16]}
function windStrength(v){if(v<5)return'Calm';if(v<20)return'Light breeze';if(v<39)return'Moderate breeze';if(v<62)return'Strong breeze';if(v<89)return'Gale';return'Storm-force wind'}
function downwindVector(){const a=(windDir+180)*Math.PI/180;return{x:Math.sin(a),y:-Math.cos(a)}}
function drawSky(w,h){const c=isDay?['#6fb4e8','#d9efff','#f3d6a4']:['#06101d','#132640','#263a53'],g=ctx.createLinearGradient(0,0,0,h*.72);g.addColorStop(0,c[0]);g.addColorStop(.66,c[1]);g.addColorStop(1,c[2]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(!isDay){ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#f5efcf';ctx.beginPath();ctx.arc(w*.82,h*.145,27,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#fff8c6';ctx.globalAlpha=.82;ctx.beginPath();ctx.arc(w*.84,h*.13,34,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function cloudPos(c,w,h,t){const d=downwindVector(),speed=Math.max(3.2,wind*.16),dx=t*speed*.003*d.x,dy=t*speed*.0012*d.y;return{x:((c.x+dx)%(w+360)+w+360)%(w+360)-180,y:((c.y+dy)%(h*.38+170)+h*.38+170)%(h*.38+170)+28}}
function fillCloudEllipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawClouds(w,h,t){ctx.fillStyle=isDay?'#ffffff':'#aebdcc';for(const c of clouds){const p=cloudPos(c,w,h,t),x=p.x,y=p.y+Math.sin(t*.0002+c.p)*3,s=c.s;fillCloudEllipse(x,y,74*s,24*s);fillCloudEllipse(x-47*s,y-6*s,42*s,24*s);fillCloudEllipse(x-10*s,y-18*s,38*s,28*s);fillCloudEllipse(x+30*s,y-14*s,44*s,30*s);fillCloudEllipse(x+58*s,y-3*s,33*s,22*s)}}
function drawField(w,h){const horizon=h*.60,g=ctx.createLinearGradient(0,horizon,0,h);g.addColorStop(0,isDay?'#6f9f52':'#27422d');g.addColorStop(.58,isDay?'#517940':'#1b3022');g.addColorStop(1,isDay?'#335636':'#0e1b15');ctx.fillStyle=g;ctx.fillRect(0,horizon,w,h-horizon);ctx.fillStyle=isDay?'#5f8b48':'#213827';ctx.beginPath();ctx.moveTo(0,horizon+14);for(let x=0;x<=w;x+=80)ctx.lineTo(x,horizon-8-Math.sin(x*.008)*12-Math.sin(x*.021)*4);ctx.lineTo(w,horizon+26);ctx.lineTo(0,horizon+26);ctx.fill()}
function kiteCount(){if(!isDay||wind<4||wind>45)return 0;if(wind<9)return 1;if(wind<23)return 2;return 3}
function drawKites(w,h,t){const count=kiteCount(),d=downwindVector(),gustBoost=Math.min(1,Math.max(0,gust-wind)/18);for(let i=0;i<count;i++){const k=kites[i],anchorX=w*(k.x-.06),anchorY=h*.80,baseX=w*k.x,baseY=h*k.y-(wind*1.05),bob=Math.sin(t*.0018+k.p)*(7+wind*.17),swayX=d.x*(18+wind*1.3)+Math.sin(t*.0012+k.p)*7*(1+gustBoost),swayY=d.y*(6+wind*.28),x=baseX+swayX,y=baseY+bob+swayY;ctx.strokeStyle='#ffffff80';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(anchorX,anchorY);ctx.quadraticCurveTo((anchorX+x)*.5-d.x*18,anchorY-90-(wind*1.4),x,y+14);ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(d.y,d.x)+Math.PI/2+Math.sin(t*.0018+k.p)*.05);ctx.fillStyle=k.c;ctx.beginPath();ctx.moveTo(0,-18);ctx.bezierCurveTo(13,-13,16,-4,15,0);ctx.bezierCurveTo(13,8,7,14,0,20);ctx.bezierCurveTo(-7,14,-13,8,-15,0);ctx.bezierCurveTo(-16,-4,-13,-13,0,-18);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffff88';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(0,18);ctx.stroke();ctx.restore();ctx.strokeStyle=k.c;ctx.lineWidth=1.4;ctx.beginPath();for(let j=0;j<8;j++){const q=j/7,tx=x+d.x*(12+q*58)+Math.sin(t*.003+j+k.p)*4,ty=y+20+d.y*(12+q*58)+q*34;if(j===0)ctx.moveTo(tx,ty);else ctx.lineTo(tx,ty)}ctx.stroke();for(let j=2;j<7;j+=2){const q=j/7,tx=x+d.x*(12+q*58)+Math.sin(t*.003+j+k.p)*4,ty=y+20+d.y*(12+q*58)+q*34;ctx.fillStyle=k.c;ctx.beginPath();ctx.moveTo(tx-4,ty-2);ctx.lineTo(tx,ty+2);ctx.lineTo(tx+4,ty-2);ctx.lineTo(tx,ty-5);ctx.closePath();ctx.fill()}}}
function drawNightParticles(w,h,t){if(isDay)return;const strength=Math.max(1,wind),d=downwindVector();if(particles.length<Math.min(40,8+strength)){particles.push({x:Math.random()*w,y:h*.25+Math.random()*h*.62,v:.45+Math.random()*1.3,a:Math.random()*6.28,fire:wind<6&&Math.random()>.45,sz:3+Math.random()*4})}particles=particles.filter(p=>p.x>-90&&p.x<w+90&&p.y>-90&&p.y<h+90);for(const p of particles){p.x+=d.x*strength*.028*p.v;p.y+=d.y*strength*.013*p.v;p.a+=.04*p.v;if(p.fire){ctx.fillStyle='#eaff91';ctx.globalAlpha=.5+.4*Math.sin(t*.004+p.a);ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill()}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(d.y,d.x)+p.a*.12);ctx.fillStyle='#8a6a42bb';ctx.globalAlpha=.72;ctx.beginPath();ctx.ellipse(0,0,p.sz,2,0,0,Math.PI*2);ctx.fill();ctx.restore()}}ctx.globalAlpha=1}
function draw(t){const r=stage.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);drawSky(w,h);drawClouds(w,h,t);drawField(w,h);drawKites(w,h,t);drawNightParticles(w,h,t);requestAnimationFrame(draw)}
async function loadCatalog(){try{catalog=await fetch('https://raw.githubusercontent.com/bennessism/window/main/weather/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()})}catch(e){catalog={default:{country:'my',location:'selangor'},countries:{my:{name:'Malaysia',locations:[{id:'selangor',name:'Selangor',city:'Shah Alam',lat:3.0738,lon:101.5183}]}}}}populateCountries()}
function populateCountries(){countrySelect.innerHTML='';Object.entries(catalog.countries).forEach(([id,c])=>{const o=document.createElement('option');o.value=id;o.textContent=c.name;countrySelect.append(o)});countrySelect.value=localStorage.getItem('windCountry')||catalog.default.country||'my';if(!catalog.countries[countrySelect.value])countrySelect.value=Object.keys(catalog.countries)[0];populateLocations()}
function populateLocations(){locationSelect.innerHTML='';const c=catalog.countries[countrySelect.value];c.locations.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.name+(l.city&&l.city!==l.name?' · '+l.city:'');locationSelect.append(o)});const saved=localStorage.getItem('windLocation')||catalog.default.location;if(c.locations.some(l=>l.id===saved))locationSelect.value=saved}
function selectedLocation(){const c=catalog.countries[countrySelect.value];return c.locations.find(l=>l.id===locationSelect.value)||c.locations[0]}
function labelFor(loc){return loc.city&&loc.city!==loc.name?`${loc.name} · ${loc.city}`:loc.name}function areaFor(loc){return loc.name||loc.city||'Location'}
function fmtTime(iso){if(!iso)return'--';const m=String(iso).match(/T(\d{2}):(\d{2})/);if(!m)return'--';let h=Number(m[1]);const min=m[2],s=h>=12?'PM':'AM';h=h%12||12;return`${h}:${min} ${s}`}
function refreshUI(updatedIso){const strength=windStrength(wind),dir=compassName(windDir);summaryLine.textContent=`${currentArea} · ${strength} · ${Math.round(wind)} km/h`;detailLoc.textContent=currentPlace;conditionEl.textContent=strength;speedEl.textContent=Math.round(wind);gustEl.textContent=Math.round(gust)+' km/h';fromText.textContent='From '+dir;directionEl.textContent=Math.round(windDir)+'°';updatedEl.textContent='Updated '+fmtTime(updatedIso)}
async function loadWind(lat=currentLat,lon=currentLon,label=currentPlace,area=currentArea){currentLat=lat;currentLon=lon;currentPlace=label;currentArea=area;try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&wind_speed_unit=kmh&timezone=auto`;const j=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()});wind=Number(j.current.wind_speed_10m)||0;gust=Number(j.current.wind_gusts_10m)||wind;windDir=Number(j.current.wind_direction_10m)||0;isDay=Number(j.current.is_day)===1;document.querySelector('meta[name="theme-color"]').content=isDay?'#76b7e8':'#07111f';refreshUI(j.current.time);seedScene(stage.clientWidth,stage.clientHeight)}catch(e){summaryLine.textContent=currentArea+' · data unavailable'}}
function useBrowserLocation(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{picker.classList.remove('show');loadWind(p.coords.latitude,p.coords.longitude,'Your location','Your location')},()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:600000})}
document.getElementById('summaryBtn').onclick=()=>detailBack.classList.add('show');document.getElementById('detailClose').onclick=()=>detailBack.classList.remove('show');detailBack.onclick=e=>{if(e.target===detailBack)detailBack.classList.remove('show')};document.getElementById('changeLocationBtn').onclick=()=>picker.classList.toggle('show');countrySelect.onchange=populateLocations;document.getElementById('myLocationBtn').onclick=useBrowserLocation;document.getElementById('applyLocationBtn').onclick=()=>{const loc=selectedLocation();localStorage.setItem('windCountry',countrySelect.value);localStorage.setItem('windLocation',loc.id);picker.classList.remove('show');loadWind(loc.lat,loc.lon,labelFor(loc),areaFor(loc))};document.getElementById('refreshBtn').onclick=()=>loadWind();
scroller.addEventListener('scroll',()=>{if(innerWidth>700)return;const i=Math.max(0,Math.min(2,Math.round(scroller.scrollLeft/innerWidth)));document.querySelectorAll('.dots i').forEach((d,n)=>d.classList.toggle('on',n===i))},{passive:true});addEventListener('resize',resize);resize();requestAnimationFrame(draw);loadCatalog().then(()=>{const loc=selectedLocation();loadWind(loc.lat,loc.lon,labelFor(loc),areaFor(loc))});setInterval(()=>loadWind(),10*60*1000);
</script>
</body>
</html>
