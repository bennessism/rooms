<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#76b7e8">
<title>Wind Field</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#82bfe9;color:#fff}button{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;overflow:hidden}#scroller{position:absolute;inset:0;overflow:hidden}#stage{position:relative;width:100vw;height:100vh;min-height:480px}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:20;display:flex;gap:10px;align-items:stretch;pointer-events:none}.card{background:#0b1722a8;border:1px solid #ffffff2b;box-shadow:0 12px 35px #0002;backdrop-filter:blur(12px);border-radius:18px}.weather{min-width:185px;padding:12px 14px}.place{font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}.speed{font-size:28px;font-weight:750;line-height:1.05;margin-top:4px}.sub{font-size:12px;opacity:.82;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}.compass{width:94px;height:94px;position:relative;display:grid;place-items:center}.compass span{position:absolute;font-size:10px;font-weight:700;opacity:.8}.n{top:7px}.s{bottom:7px}.e{right:8px}.w{left:8px}.dial{width:48px;height:48px;border:1px solid #ffffff55;border-radius:50%;position:relative}.arrow{position:absolute;left:50%;top:50%;width:3px;height:22px;background:#fff;border-radius:3px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);box-shadow:0 0 8px #fff8}.arrow:before{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid #fff}.centerDot{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.controls{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:25;display:flex;gap:8px}.controls button{border:1px solid #ffffff2b;background:#0b1722a8;backdrop-filter:blur(12px);border-radius:999px;padding:10px 13px;cursor:pointer}.controls button:active{transform:scale(.97)}.status{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;padding:8px 12px;border-radius:999px;background:#0b172294;border:1px solid #ffffff22;backdrop-filter:blur(10px);font-size:11px;letter-spacing:.03em;opacity:.9;white-space:nowrap}.dots{display:none}
@media(max-width:700px){#scroller{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}#stage{width:300vw}.panelSnap{position:absolute;top:0;bottom:0;width:100vw;scroll-snap-align:start;pointer-events:none}.p1{left:0}.p2{left:100vw}.p3{left:200vw}.hud{right:10px;top:10px;gap:6px}.weather{min-width:145px;padding:9px 10px}.speed{font-size:22px}.sub{font-size:10px;gap:7px}.place{max-width:150px}.compass{width:78px;height:78px}.dial{width:40px;height:40px}.arrow{height:18px}.controls{left:10px;top:10px}.controls button{padding:9px 11px;font-size:12px}.status{bottom:30px;font-size:10px}.dots{display:flex;position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;gap:7px}.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#ffffff66}.dots i.on{background:#fff}}
</style>
</head>
<body>
<div id="viewport"><div id="scroller"><div id="stage"><canvas id="scene"></canvas><div class="panelSnap p1"></div><div class="panelSnap p2"></div><div class="panelSnap p3"></div></div></div><div class="controls"><button id="locBtn">◎ My location</button><button id="refreshBtn">↻</button></div><div class="hud"><div class="card weather"><div class="place" id="place">Loading wind…</div><div class="speed"><span id="speed">--</span> <small style="font-size:13px;font-weight:500">km/h</small></div><div class="sub"><span id="dirText">--</span><span>Gust <b id="gust">--</b></span><span id="phase">--</span></div></div><div class="card compass"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><div class="dial"><div class="arrow" id="arrow"></div><div class="centerDot"></div></div></div></div><div class="status" id="status">Live wind drives the field</div><div class="dots"><i class="on"></i><i></i><i></i></div></div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),scroller=document.getElementById('scroller');
const speedEl=document.getElementById('speed'),gustEl=document.getElementById('gust'),dirEl=document.getElementById('dirText'),phaseEl=document.getElementById('phase'),placeEl=document.getElementById('place'),arrow=document.getElementById('arrow'),statusEl=document.getElementById('status');
let wind=12,gust=18,windDir=250,isDay=true,turbineAngle=0,last=performance.now(),particles=[],stars=[],kites=[],clouds=[];let currentLat=3.1073,currentLon=101.6067,currentPlace='Petaling Jaya';
const DPR=()=>Math.min(devicePixelRatio||1,2);
function resize(){const r=stage.getBoundingClientRect(),d=DPR();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);seedScene(r.width,r.height)}
function seedScene(w,h){stars=Array.from({length:110},()=>({x:Math.random()*w,y:Math.random()*h*.58,r:.35+Math.random()*1.15,a:.3+Math.random()*.7}));clouds=Array.from({length:7},(_,i)=>({x:(i/7)*w+Math.random()*200,y:55+Math.random()*155,s:.65+Math.random()*1.15}));kites=[{x:.58,y:.28,c:'#ff5b67',p:0},{x:.72,y:.21,c:'#ffd54a',p:2.1},{x:.84,y:.31,c:'#4ad1c8',p:4.2}];particles=[]}
function compassName(deg){const n=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return n[Math.round((deg%360)/22.5)%16]}
function skyColors(){return isDay?['#6fb4e8','#d9efff','#f3d6a4']:['#06101d','#132640','#263a53']}
function drawSky(w,h){const c=skyColors(),g=ctx.createLinearGradient(0,0,0,h*.72);g.addColorStop(0,c[0]);g.addColorStop(.66,c[1]);g.addColorStop(1,c[2]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(!isDay){ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#f6efc7';ctx.beginPath();ctx.arc(w*.82,h*.145,27,0,Math.PI*2);ctx.fill();ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(w*.835,h*.135,26,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#fff8c6';ctx.globalAlpha=.83;ctx.beginPath();ctx.arc(w*.84,h*.13,34,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function drawClouds(w,h,t){const sign=Math.sin(windDir*Math.PI/180)>=0?1:-1,drift=sign*Math.max(3.5,wind*.17);ctx.fillStyle=isDay?'#ffffffa8':'#c9d5df20';for(const c of clouds){let x=((c.x+t*drift*.003)%(w+340)+w+340)%(w+340)-170,y=c.y;ctx.beginPath();ctx.ellipse(x,y,72*c.s,24*c.s,0,0,Math.PI*2);ctx.ellipse(x+46*c.s,y-11*c.s,44*c.s,27*c.s,0,0,Math.PI*2);ctx.ellipse(x-44*c.s,y-6*c.s,39*c.s,23*c.s,0,0,Math.PI*2);ctx.fill()}}
function drawField(w,h,t){const horizon=h*.60;ctx.fillStyle=isDay?'#5e9145':'#203526';ctx.beginPath();ctx.moveTo(0,horizon+15);for(let x=0;x<=w;x+=70)ctx.lineTo(x,horizon-7-Math.sin(x*.009)*15);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();const g=ctx.createLinearGradient(0,horizon,0,h);g.addColorStop(0,isDay?'#78a956':'#2a432d');g.addColorStop(.55,isDay?'#4e7b3c':'#1d3223');g.addColorStop(1,isDay?'#2e582f':'#0f1c16');ctx.fillStyle=g;ctx.fillRect(0,horizon+15,w,h-horizon);ctx.fillStyle=isDay?'#759e59':'#273d2c';ctx.globalAlpha=.22;for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(w*(.25+i*.18),horizon+65+i*7,220,24,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const bend=Math.sin(windDir*Math.PI/180)*Math.min(15,wind*.42),amp=Math.min(20,3+wind*.36);for(let layer=0;layer<3;layer++){ctx.strokeStyle=layer===0?(isDay?'#89b96a':'#38593d'):layer===1?(isDay?'#6a9b50':'#2c4932'):(isDay?'#4f7e3f':'#213926');ctx.lineWidth=layer===0?1.1:1;const gap=layer===0?11:layer===1?9:7;for(let x=layer*3;x<w;x+=gap){const depth=layer/3,base=horizon+28+depth*70+((x*17+layer*31)%Math.max(60,h-horizon-60)),len=11+depth*10+((x*5)%18),wave=Math.sin(t*.004+x*.03+layer)*amp*.11;ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+bend*.45+wave,base-len*.55,x+bend*(.75+depth*.25),base-len);ctx.stroke()}}}
function drawPath(w,h){const horizon=h*.60,px=innerWidth<=700?w*.49:w*.53;ctx.fillStyle=isDay?'#c4af86aa':'#726b5b88';ctx.beginPath();ctx.moveTo(px-18,horizon+18);ctx.lineTo(px+28,horizon+18);ctx.lineTo(px+150,h);ctx.lineTo(px-80,h);ctx.closePath();ctx.fill()}
function drawTurbine(w,h,t){const mobile=innerWidth<=700,cx=w*(mobile?1/6:.155),ground=h*.80,hubY=h*.34,scale=Math.min(w/(mobile?830:1340),h/720);ctx.save();ctx.translate(cx,hubY);ctx.fillStyle=isDay?'#eef2f4':'#aab5bf';ctx.beginPath();ctx.moveTo(-8*scale,4*scale);ctx.lineTo(-24*scale,ground-hubY);ctx.lineTo(26*scale,ground-hubY);ctx.lineTo(9*scale,4*scale);ctx.closePath();ctx.fill();ctx.fillStyle=isDay?'#d7dee3':'#8996a2';ctx.beginPath();ctx.roundRect(-11*scale,-11*scale,48*scale,22*scale,7*scale);ctx.fill();const rpm=Math.min(.047,.006+wind*.00105);turbineAngle+=rpm*(t-last);ctx.rotate(turbineAngle);for(let i=0;i<3;i++){ctx.save();ctx.rotate(i*Math.PI*2/3);ctx.fillStyle=isDay?'#f7f8f9':'#c4ced5';ctx.beginPath();ctx.moveTo(2*scale,-6*scale);ctx.quadraticCurveTo(74*scale,-17*scale,152*scale,-7*scale);ctx.quadraticCurveTo(110*scale,5*scale,12*scale,12*scale);ctx.quadraticCurveTo(3*scale,6*scale,2*scale,-6*scale);ctx.fill();ctx.restore()}ctx.fillStyle=isDay?'#bec8ce':'#8f9ba4';ctx.beginPath();ctx.arc(0,0,14*scale,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle=isDay?'#ffffff40':'#ff5151';if(!isDay){ctx.beginPath();ctx.arc(cx+31*scale,hubY-13*scale,2.4*scale,0,Math.PI*2);ctx.fill()}}
function drawPerson(x,y,s=1){ctx.strokeStyle=isDay?'#41505a':'#77838b';ctx.fillStyle=isDay?'#41505a':'#77838b';ctx.lineWidth=2*s;ctx.beginPath();ctx.arc(x,y-18*s,4*s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y-14*s);ctx.lineTo(x,y);ctx.moveTo(x,y-9*s);ctx.lineTo(x-7*s,y-3*s);ctx.moveTo(x,y-9*s);ctx.lineTo(x+7*s,y-4*s);ctx.moveTo(x,y);ctx.lineTo(x-6*s,y+10*s);ctx.moveTo(x,y);ctx.lineTo(x+6*s,y+10*s);ctx.stroke()}
function drawPlayground(w,h){const ground=h*.745,sx=innerWidth<=700?w*.55:w*.61,ink=isDay?'#52616a':'#66737b';ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,ground);ctx.lineTo(sx+37,ground-60);ctx.lineTo(sx+74,ground);ctx.moveTo(sx+17,ground-30);ctx.lineTo(sx+55,ground-30);ctx.stroke();ctx.strokeStyle=isDay?'#d4d9dd':'#79858d';ctx.lineWidth=1.5;for(const dx of [24,48]){ctx.beginPath();ctx.moveTo(sx+dx,ground-30);ctx.lineTo(sx+dx-2,ground-9);ctx.stroke()}ctx.fillStyle=isDay?'#d65d5d':'#744747';ctx.fillRect(sx+118,ground-31,72,8);ctx.fillStyle=isDay?'#8d694e':'#5a5049';ctx.fillRect(sx+126,ground-23,5,22);ctx.fillRect(sx+177,ground-23,5,22);ctx.strokeStyle=ink;ctx.beginPath();ctx.arc(sx+240,ground-11,18,Math.PI,0);ctx.moveTo(sx+222,ground-11);ctx.lineTo(sx+222,ground);ctx.moveTo(sx+258,ground-11);ctx.lineTo(sx+258,ground);ctx.stroke();if(isDay){drawPerson(sx+315,ground-9,.75);drawPerson(sx+360,ground-6,.7)}}
function kiteCount(){if(!isDay||wind<4||wind>45)return 0;if(wind<9)return 1;if(wind<23)return 2;return 3}
function drawKites(w,h,t){const count=kiteCount(),theta=windDir*Math.PI/180,downX=-Math.sin(theta),strength=Math.min(1,wind/32);for(let i=0;i<count;i++){const k=kites[i],anchorX=w*(k.x-.03),anchorY=h*.755,altitude=(.19-i*.015)-strength*.035,baseX=w*k.x+downX*45*strength,baseY=h*Math.max(.12,k.y-altitude*.18),gustiness=Math.max(0,(gust-wind)/25);const x=baseX+Math.sin(t*.0015+k.p)*18*(.6+strength)+Math.sin(t*.004+k.p)*7*gustiness,y=baseY+Math.cos(t*.0019+k.p)*9*(.4+strength);ctx.strokeStyle=isDay?'#ffffff9c':'#ffffff55';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(anchorX,anchorY);ctx.quadraticCurveTo((anchorX+x)/2-downX*25,anchorY-75,x,y+17);ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.0022+k.p)*(.08+.08*strength)-downX*.08);const size=15+strength*5;ctx.fillStyle=k.c;ctx.beginPath();ctx.moveTo(0,-size);ctx.lineTo(size*.86,0);ctx.lineTo(0,size);ctx.lineTo(-size*.86,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffffa8';ctx.beginPath();ctx.moveTo(0,-size);ctx.lineTo(0,size);ctx.moveTo(-size*.86,0);ctx.lineTo(size*.86,0);ctx.stroke();ctx.restore();ctx.strokeStyle=k.c;ctx.beginPath();for(let j=0;j<5;j++){const yy=y+size+7+j*9,xx=x+downX*(j*7)+Math.sin(t*.004+j+k.p)*4;if(j===0)ctx.moveTo(x,y+size);ctx.lineTo(xx,yy)}ctx.stroke()}}
function drawNightParticles(w,h,t){if(isDay)return;const strength=Math.max(1,wind),limit=Math.min(65,10+strength*1.3);if(particles.length<limit){particles.push({x:Math.random()*w,y:h*.18+Math.random()*h*.67,v:.5+Math.random()*1.6,a:Math.random()*6.28,fire:wind<6&&Math.random()>.35})}const sx=Math.sin(windDir*Math.PI/180),sy=-Math.cos(windDir*Math.PI/180);particles=particles.filter(p=>p.x>-90&&p.x<w+90&&p.y>-90&&p.y<h+90);for(const p of particles){p.x+=sx*strength*.04*p.v;p.y+=sy*strength*.017*p.v;p.a+=.035*p.v;if(p.fire){ctx.fillStyle='#edff97';ctx.globalAlpha=.55+.35*Math.sin(t*.004+p.a);ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill()}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='#91724acc';ctx.globalAlpha=.82;ctx.beginPath();ctx.ellipse(0,0,5,2.5,.4,0,Math.PI*2);ctx.fill();ctx.restore()}}ctx.globalAlpha=1}
function draw(t){const r=stage.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);drawSky(w,h);drawClouds(w,h,t);drawField(w,h,t);drawPath(w,h);drawPlayground(w,h);drawTurbine(w,h,t);drawKites(w,h,t);drawNightParticles(w,h,t);last=t;requestAnimationFrame(draw)}
async function loadWind(lat=currentLat,lon=currentLon,label=currentPlace){currentLat=lat;currentLon=lon;currentPlace=label;placeEl.textContent=label;statusEl.textContent='Updating live wind…';try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&wind_speed_unit=kmh&timezone=auto`;const j=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Weather unavailable');return r.json()});wind=Number(j.current.wind_speed_10m)||0;gust=Number(j.current.wind_gusts_10m)||wind;windDir=Number(j.current.wind_direction_10m)||0;isDay=Number(j.current.is_day)===1;speedEl.textContent=Math.round(wind);gustEl.textContent=Math.round(gust)+' km/h';dirEl.textContent='From '+compassName(windDir);phaseEl.textContent=isDay?'Day':'Night';arrow.style.transform=`translate(-50%,-100%) rotate(${windDir}deg)`;document.querySelector('meta[name="theme-color"]').content=isDay?'#76b7e8':'#07111f';statusEl.textContent=`Wind from ${compassName(windDir)} · ${Math.round(windDir)}°`;seedScene(stage.clientWidth,stage.clientHeight)}catch(e){statusEl.textContent='Using demo wind · live data unavailable';placeEl.textContent=label+' · demo'}}
function useLocation(){if(!navigator.geolocation){statusEl.textContent='Location not available';return}statusEl.textContent='Requesting location…';navigator.geolocation.getCurrentPosition(p=>loadWind(p.coords.latitude,p.coords.longitude,'Your location'),()=>{statusEl.textContent='Location denied · using Petaling Jaya';loadWind(3.1073,101.6067,'Petaling Jaya')},{enableHighAccuracy:false,timeout:8000,maximumAge:600000})}
document.getElementById('locBtn').onclick=useLocation;document.getElementById('refreshBtn').onclick=()=>loadWind();scroller.addEventListener('scroll',()=>{if(innerWidth>700)return;const i=Math.max(0,Math.min(2,Math.round(scroller.scrollLeft/innerWidth)));document.querySelectorAll('.dots i').forEach((d,n)=>d.classList.toggle('on',n===i))},{passive:true});addEventListener('resize',resize);resize();requestAnimationFrame(draw);loadWind();setInterval(()=>loadWind(),10*60*1000);
</script>
</body>
</html>
