<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Rooms — Endless Corridor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010;color:#f5f2eb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit}
#app,#world{position:absolute;inset:0;overflow:hidden}#world{background:#171717;perspective:900px}
.scene{position:absolute;inset:0;background:linear-gradient(#c9c5bc 0 15%,#e7e2d8 15% 70%,#6e6a63 70% 100%)}
.ceiling{position:absolute;left:17%;right:17%;top:0;height:18%;background:linear-gradient(90deg,#99958d,#f0ede6 25% 75%,#99958d);clip-path:polygon(12% 0,88% 0,72% 100%,28% 100%)}
.floor{position:absolute;left:8%;right:8%;bottom:0;height:35%;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(0,0,0,.06) 80px),linear-gradient(#918c84,#56534e);clip-path:polygon(0 100%,100% 100%,68% 0,32% 0)}
.leftWall,.rightWall{position:absolute;top:14%;bottom:29%;width:51%;background:linear-gradient(#e5e0d7,#c9c3b9)}
.leftWall{left:0;clip-path:polygon(0 0,100% 16%,100% 84%,0 100%)}.rightWall{right:0;clip-path:polygon(0 16%,100% 0,100% 100%,0 84%)}
.vanish{position:absolute;left:45%;right:45%;top:37%;bottom:35%;background:#111;box-shadow:0 0 30px #0008}
.obj{position:absolute;z-index:6;transform-origin:center bottom;transition:transform .18s ease,left .18s ease,top .18s ease,opacity .18s ease,filter .18s ease}.obj.far{pointer-events:none}
.art{background:#f8f4ec;padding:4px;border:4px solid #292724;box-shadow:0 8px 18px #0004}.art canvas{display:block;width:100%;height:100%}
.door{border:4px solid #51473c;border-bottom:0;background:linear-gradient(90deg,#685845,#947a5f,#6a5843);box-shadow:0 10px 20px #0005;cursor:pointer}.door::after{content:"";position:absolute;right:12%;top:49%;width:7px;height:7px;border-radius:50%;background:#d6b96e}.door.near{filter:brightness(1.14);box-shadow:0 0 0 2px #fff6,0 12px 24px #0006}.door[data-kind=plant]{background:linear-gradient(90deg,#35523e,#6d8a70,#3c5945)}.door[data-kind=rain]{background:linear-gradient(90deg,#4b5e6d,#8399a8,#4d6170)}.door[data-kind=dark]{background:linear-gradient(90deg,#17181d,#30313a,#17181c)}.door[data-kind=light]{background:linear-gradient(90deg,#d9d5cc,#fffdf7,#d8d4cb)}.door[data-kind=ghost]{background:linear-gradient(90deg,#443e59,#786f98,#47405e)}.door[data-kind=color]{background:linear-gradient(135deg,#d85d63,#e7b75e,#63a6be,#7d62bb)}.door[data-kind=mirror]{background:linear-gradient(120deg,#8e979c,#eef2f3 45%,#727c82 60%,#dce2e4)}
.turnHint{position:absolute;left:50%;top:39%;transform:translateX(-50%);z-index:15;padding:12px 18px;border-radius:14px;background:#111c;border:1px solid #fff2;backdrop-filter:blur(8px);display:none;text-align:center;font-size:13px}.turnHint.show{display:block}.turnArrows{font-size:28px;letter-spacing:18px;margin-top:4px}
.topbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;padding:8px 12px;border-radius:999px;background:#111a;border:1px solid #fff2;backdrop-filter:blur(10px);font-size:12px;letter-spacing:.06em;white-space:nowrap}
.hud{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center;padding:8px;border-radius:18px;background:#111a;border:1px solid #fff2;backdrop-filter:blur(10px)}.hud button,.roomClose{width:48px;height:48px;border:1px solid #fff2;border-radius:13px;background:#ffffff12;cursor:pointer;font-size:21px}.hud button:active,.roomClose:active{transform:scale(.94)}.hud button:disabled{opacity:.28;cursor:default}#walk{width:64px}.meter{min-width:92px;text-align:center;font-size:12px;color:#ddd}
#room{position:absolute;inset:0;z-index:50;display:none;background:#ddd;color:#111}#room.show{display:block}.roomScene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.roomClose{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:70;background:#1118;color:white}.roomLabel{position:absolute;left:18px;bottom:18px;z-index:70;padding:9px 12px;border-radius:11px;background:#1119;color:#fff;font-size:12px}.gallery{background:linear-gradient(#eeeae2 0 72%,#77726a 72%)}.roomArts{display:flex;gap:clamp(12px,4vw,55px);width:88%;height:58%;align-items:center;justify-content:center}.roomArt{background:#fff;padding:7px;border:7px solid #292724;box-shadow:0 15px 35px #0004}.roomArt canvas{width:100%;height:100%;display:block}.colorRoom{animation:colors 14s linear infinite alternate}@keyframes colors{0%{background:#ec9aa8}25%{background:#90bcc7}50%{background:#d9c178}75%{background:#927fb4}100%{background:#86b68d}}.darkRoom{background:radial-gradient(circle,#322a46,#08080d 72%)}.lightRoom{background:linear-gradient(135deg,#fff,#e9e6df)}.rainRoom{background:linear-gradient(#2b3942,#12191e)}.window{width:min(76vw,850px);height:min(62vh,580px);border:14px solid #292d2f;background:linear-gradient(#314855,#17242d);position:relative;overflow:hidden}.window::before{content:"";position:absolute;inset:-80px;background:repeating-linear-gradient(105deg,transparent 0 22px,#d6edf266 23px 24px,transparent 25px 48px);animation:rain .6s linear infinite}@keyframes rain{to{transform:translate(-25px,70px)}}.plantRoom{background:linear-gradient(#d9e3d3 0 72%,#8a765e 72%)}.plant{position:absolute;bottom:8%;font-size:clamp(60px,10vw,130px)}.plant.p1{left:8%}.plant.p2{right:8%;transform:scale(.8)}.plant.p3{left:37%;transform:scale(.55)}.mirrorRoom{background:linear-gradient(120deg,#99a3a8,#edf2f2 30%,#7d888d 49%,#eef2f3 72%,#949da2)}.floatRoom{background:radial-gradient(circle,#d8d0e8,#746e88)}.shape{position:absolute;width:85px;height:85px;background:#ffffff55;border:1px solid #fff8;animation:drift 9s ease-in-out infinite alternate}.shape:nth-child(2n){border-radius:50%}.shape:nth-child(3n){border-radius:35% 65% 55% 45%}@keyframes drift{to{transform:translate(65px,-85px) rotate(140deg)}}.sculptRoom{background:linear-gradient(#e8e5dd 0 73%,#78736a 73%)}.sculpt{width:min(34vw,330px);aspect-ratio:1;border-radius:37% 63% 45% 55%/56% 35% 65% 44%;background:linear-gradient(135deg,#25252b,#aaa5b6 48%,#303039);box-shadow:0 28px 50px #0005;animation:sc 12s ease-in-out infinite alternate}@keyframes sc{to{transform:rotate(25deg);border-radius:64% 36% 68% 32%/39% 65% 35% 61%}}.tinyRoom{background:#d8d1c5}.tinyBox{width:min(58vw,420px);height:min(54vh,390px);background:#f2eee7;border:18px solid #8d8172;box-shadow:0 20px 50px #0004;display:grid;place-items:center;font-size:56px}.hugeRoom{background:linear-gradient(#dbd7d0 0 80%,#5a5854 80%)}.hugeRoom::before{content:"";position:absolute;width:23vw;height:35vh;left:38.5vw;bottom:20%;background:#f5f2ea;border:9px solid #292725}.emptyRoom{background:linear-gradient(#e8e3da 0 76%,#918b81 76%)}.soundRoom{background:radial-gradient(circle,#344151,#13171d)}.ring{position:absolute;width:100px;height:100px;border:2px solid #cfe3ff;border-radius:50%;animation:ring 3s ease-out infinite}.ring:nth-child(2){animation-delay:1s}.ring:nth-child(3){animation-delay:2s}@keyframes ring{to{transform:scale(6);opacity:0}}.ghostRoom{background:radial-gradient(circle,#504669,#15131d 72%)}.ghost{position:absolute;width:72px;height:92px;border-radius:52% 48% 42% 58%/43% 46% 54% 57%;background:#eef4ffbf;box-shadow:0 0 24px #c7d7ff77;animation:floatg 4s ease-in-out infinite alternate}.ghost::before,.ghost::after{content:"";position:absolute;top:34%;width:8px;height:11px;border-radius:50%;background:#262437}.ghost::before{left:27%}.ghost::after{right:27%}.ghost span{position:absolute;left:0;right:0;bottom:-20px;height:42px;background:inherit;clip-path:polygon(0 0,18% 45%,34% 8%,50% 58%,67% 12%,82% 52%,100% 0,100% 100%,0 100%)}@keyframes floatg{to{transform:translateY(-24px) rotate(4deg)}}
@media(max-width:700px){.hud button{width:44px;height:44px}.hud{gap:6px}.meter{min-width:74px}.topbar{font-size:11px}.door{border-width:3px}.art{border-width:3px;padding:2px}}
</style>
</head>
<body>
<div id="app">
  <div id="world"></div>
  <div class="topbar" id="topbar">ENDLESS CORRIDOR · HALL 1</div>
  <div class="turnHint" id="turnHint">The corridor turns here<div class="turnArrows">← →</div></div>
  <div class="hud">
    <button id="turnL" aria-label="Turn left" disabled>↶</button>
    <button id="walk" aria-label="Step forward">↑</button>
    <button id="turnR" aria-label="Turn right" disabled>↷</button>
    <div class="meter" id="meter">0.0 m</div>
  </div>
  <section id="room" aria-hidden="true"><button class="roomClose" id="roomClose">×</button><div class="roomScene" id="roomScene"></div><div class="roomLabel" id="roomLabel"></div></section>
</div>
<script>
const TYPES=['gallery','one','color','mirror','float','rain','plant','dark','light','sound','sculpture','tiny','huge','empty','corridor','ghost'];
const LABELS={gallery:'Mini Gallery Room',one:'One Painting Room',color:'Color Room',mirror:'Mirror Room',float:'Floating Shapes Room',rain:'Rain Room',plant:'Plant Room',dark:'Dark Gallery',light:'Light Room',sound:'Sound Room',sculpture:'Sculpture Room',tiny:'Tiny Room',huge:'Huge Hall',empty:'Empty Room',corridor:'Another Corridor',ghost:'Ghost Room'};
const STEP=.65, HALL=34, VIEW=24, seed=(Date.now()>>>0)%2147483647;let hall=1,pos=0,total=0,turnDir=0,busy=false;
const world=document.querySelector('#world'),meter=document.querySelector('#meter'),hint=document.querySelector('#turnHint'),leftBtn=document.querySelector('#turnL'),rightBtn=document.querySelector('#turnR');
function hash(n){n=(n^61)^(n>>>16);n+=(n<<3);n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return n>>>0}function rnd(n,s=0){return(hash(seed+n*977+s*131)%10000)/10000}
function palette(n){const p=[['#e95f67','#f3c969','#4e8ea6','#25364a'],['#6c63a8','#cf8fb3','#78b7a4','#f1d590'],['#22223b','#4a4e69','#9a8c98','#c9ada7'],['#ef8354','#4f5d75','#bfc0c0','#2d3142'],['#2a9d8f','#e9c46a','#f4a261','#e76f51']];return p[hash(n)%p.length]}
function drawArt(c,n){const x=c.getContext('2d'),w=c.width=240,h=c.height=180,p=palette(n);x.fillStyle=p[3];x.fillRect(0,0,w,h);for(let i=0;i<18;i++){x.globalAlpha=.3+rnd(n,i)*.6;x.fillStyle=p[i%p.length];x.beginPath();if(i%3===0){x.arc(rnd(i,n)*w,rnd(n,i+9)*h,12+rnd(n+4,i)*65,0,Math.PI*2);x.fill()}else{x.save();x.translate(rnd(n,i+3)*w,rnd(i+7,n)*h);x.rotate(rnd(n+9,i)*Math.PI);x.fillRect(-45,-12,90+rnd(i,n)*70,20+rnd(n,i)*40);x.restore()}}x.globalAlpha=1}
function roomType(h,i){return TYPES[hash(h*100+i)%TYPES.length]}
function objectList(){let out=[];for(let i=1;i<=18;i++){let d=i*3.2+.8,side=(i%2?'left':'right');if(d>HALL-2)break;let door=i%3===0;out.push({d,side,door,index:i,type:door?roomType(hall,i):null})}return out}
function project(d,side){const z=Math.max(.4,d-pos),t=Math.min(1,z/VIEW),scale=1.42-(t*1.18),xNear=side==='left'?18:82,xFar=side==='left'?46:54,x=xNear+(xFar-xNear)*t,y=68-(1-t)*4;return{x,y,scale,z,opacity:Math.max(.18,1-t*.75)}}
function render(){world.innerHTML='<div class="scene"><div class="ceiling"></div><div class="floor"></div><div class="leftWall"></div><div class="rightWall"></div><div class="vanish"></div></div>';const scene=world.firstChild;objectList().filter(o=>o.d>pos-1&&o.d<pos+VIEW).sort((a,b)=>b.d-a.d).forEach(o=>{const p=project(o.d,o.side),el=document.createElement(o.door?'button':'div');el.className='obj '+(o.door?'door':'art')+(p.z<1.55?' near':'')+(p.z>8?' far':'');el.style.left=p.x+'%';el.style.top=(o.door?29:39)+'%';el.style.width=(o.door?105:105)+'px';el.style.height=(o.door?210:82)+'px';el.style.marginLeft='-52px';el.style.transform=`scale(${p.scale}) ${o.side==='left'?'skewY(3deg)':'skewY(-3deg)'}`;el.style.opacity=p.opacity;if(o.door){el.dataset.kind=o.type;el.title=p.z<1.55?LABELS[o.type]:'Walk closer';el.addEventListener('click',()=>{if(p.z<1.55)openRoom(o.type,hall*100+o.index)})}else{const c=document.createElement('canvas');el.append(c);drawArt(c,hall*1000+o.index)}scene.append(el)});const remain=HALL-pos,atTurn=remain<=.7;hint.classList.toggle('show',atTurn);leftBtn.disabled=!atTurn;rightBtn.disabled=!atTurn;document.querySelector('#walk').disabled=atTurn;meter.textContent=total.toFixed(1)+' m';document.querySelector('#topbar').textContent='ENDLESS CORRIDOR · HALL '+hall+(atTurn?' · TURN':'')}
function stepForward(){if(busy||HALL-pos<=.7)return;busy=true;pos=Math.min(HALL,pos+STEP);total+=STEP;render();setTimeout(()=>busy=false,150)}
function turn(dir){if(HALL-pos>.7)return;turnDir+=dir;hall++;pos=0;world.style.filter='brightness(.25)';setTimeout(()=>{render();world.style.filter='';},170)}
function addArts(scene,count,big,n){const box=document.createElement('div');box.className='roomArts';for(let i=0;i<count;i++){const a=document.createElement('div');a.className='roomArt';a.style.width=big?'min(62vw,650px)':Math.max(140,Math.floor(66/count))+'vw';a.style.height=big?'min(62vh,580px)':'42vh';const c=document.createElement('canvas');a.append(c);box.append(a);requestAnimationFrame(()=>drawArt(c,n+i*17))}scene.append(box)}
function ghosts(scene,n,count){for(let i=0;i<count;i++){const g=document.createElement('div');g.className='ghost';g.style.left=(8+rnd(n,i)*78)+'%';g.style.top=(12+rnd(i,n)*60)+'%';g.style.transform=`scale(${.55+rnd(n+4,i)*1.15})`;g.style.animationDelay=(-rnd(i,n+8)*4)+'s';g.style.filter=`hue-rotate(${Math.floor(rnd(n,i+15)*120)}deg)`;g.innerHTML='<span></span>';scene.append(g)}}
function openRoom(type,n){if(type==='corridor'){hall++;pos=0;render();return}const room=document.querySelector('#room'),scene=document.querySelector('#roomScene');scene.className='roomScene';scene.innerHTML='';document.querySelector('#roomLabel').textContent=LABELS[type]+' · Hall '+hall;
if(type==='gallery'){scene.classList.add('gallery');addArts(scene,3+hash(n)%4,false,n)}if(type==='one'){scene.classList.add('gallery');addArts(scene,1,true,n)}if(type==='color')scene.classList.add('colorRoom');if(type==='mirror'){scene.classList.add('mirrorRoom');for(let i=0;i<8;i++){let s=document.createElement('div');s.className='shape';s.style.left=(5+i*12)+'%';s.style.top=(12+(i%3)*24)+'%';scene.append(s)}}if(type==='float'){scene.classList.add('floatRoom');for(let i=0;i<12;i++){let s=document.createElement('div');s.className='shape';s.style.left=(rnd(n,i)*90)+'%';s.style.top=(rnd(i,n)*80)+'%';scene.append(s)}}if(type==='rain'){scene.classList.add('rainRoom');let w=document.createElement('div');w.className='window';scene.append(w)}if(type==='plant'){scene.classList.add('plantRoom');['🪴','🌿','🌱'].forEach((x,i)=>{let p=document.createElement('div');p.className='plant p'+(i+1);p.textContent=x;scene.append(p)});addArts(scene,2,false,n)}if(type==='dark'){scene.classList.add('darkRoom');addArts(scene,3,false,n);ghosts(scene,n,1)}if(type==='light'){scene.classList.add('lightRoom');addArts(scene,2,false,n)}if(type==='sound'){scene.classList.add('soundRoom');for(let i=0;i<3;i++){let r=document.createElement('div');r.className='ring';scene.append(r)}}if(type==='sculpture'){scene.classList.add('sculptRoom');let s=document.createElement('div');s.className='sculpt';scene.append(s)}if(type==='tiny'){scene.classList.add('tinyRoom');let b=document.createElement('div');b.className='tinyBox';b.textContent='🪑';scene.append(b)}if(type==='huge')scene.classList.add('hugeRoom');if(type==='empty')scene.classList.add('emptyRoom');if(type==='ghost'){scene.classList.add('ghostRoom');ghosts(scene,n,4+hash(n)%8)}room.classList.add('show');room.setAttribute('aria-hidden','false')}
function closeRoom(){const r=document.querySelector('#room');r.classList.remove('show');r.setAttribute('aria-hidden','true')}
document.querySelector('#walk').onclick=stepForward;leftBtn.onclick=()=>turn(-1);rightBtn.onclick=()=>turn(1);document.querySelector('#roomClose').onclick=closeRoom;window.addEventListener('keydown',e=>{if(document.querySelector('#room').classList.contains('show')){if(e.key==='Escape')closeRoom();return}if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')stepForward();if(e.key==='ArrowLeft')turn(-1);if(e.key==='ArrowRight')turn(1)});
let hold;const wb=document.querySelector('#walk');['pointerdown'].forEach(ev=>wb.addEventListener(ev,()=>{stepForward();hold=setInterval(stepForward,190)}));['pointerup','pointerleave','pointercancel'].forEach(ev=>wb.addEventListener(ev,()=>clearInterval(hold)));let sy=0;world.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});world.addEventListener('touchend',e=>{if(sy-e.changedTouches[0].clientY>35)stepForward()},{passive:true});render();
</script>
</body>
</html>
