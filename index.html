<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#76b7e8">
<title>Wind Field</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#82bfe9;color:#fff}
button{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;overflow:hidden}
#scroller{position:absolute;inset:0;overflow:hidden}
#stage{position:relative;width:100vw;height:100vh;min-height:480px}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:20;display:flex;gap:10px;align-items:stretch;pointer-events:none}
.card{background:#0b1722a8;border:1px solid #ffffff2b;box-shadow:0 12px 35px #0002;backdrop-filter:blur(12px);border-radius:18px}
.weather{min-width:185px;padding:12px 14px}.place{font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}.speed{font-size:28px;font-weight:750;line-height:1.05;margin-top:4px}.sub{font-size:12px;opacity:.82;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.compass{width:94px;height:94px;position:relative;display:grid;place-items:center}.compass span{position:absolute;font-size:10px;font-weight:700;opacity:.8}.n{top:7px}.s{bottom:7px}.e{right:8px}.w{left:8px}.dial{width:48px;height:48px;border:1px solid #ffffff55;border-radius:50%;position:relative}.arrow{position:absolute;left:50%;top:50%;width:3px;height:22px;background:#fff;border-radius:3px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);box-shadow:0 0 8px #fff8}.arrow:before{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid #fff}.centerDot{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.controls{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:25;display:flex;gap:8px}.controls button{border:1px solid #ffffff2b;background:#0b1722a8;backdrop-filter:blur(12px);border-radius:999px;padding:10px 13px;cursor:pointer}.controls button:active{transform:scale(.97)}
.status{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;padding:8px 12px;border-radius:999px;background:#0b172294;border:1px solid #ffffff22;backdrop-filter:blur(10px);font-size:11px;letter-spacing:.03em;opacity:.9;white-space:nowrap}
.dots{display:none}
@media(max-width:700px){
  #scroller{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  #stage{width:300vw}
  .panelSnap{position:absolute;top:0;bottom:0;width:100vw;scroll-snap-align:start;pointer-events:none}.p1{left:0}.p2{left:100vw}.p3{left:200vw}
  .hud{right:10px;top:10px;gap:6px}.weather{min-width:145px;padding:9px 10px}.speed{font-size:22px}.sub{font-size:10px;gap:7px}.place{max-width:150px}.compass{width:78px;height:78px}.dial{width:40px;height:40px}.arrow{height:18px}
  .controls{left:10px;top:10px}.controls button{padding:9px 11px;font-size:12px}
  .status{bottom:30px;font-size:10px}
  .dots{display:flex;position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;gap:7px}.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#ffffff66}.dots i.on{background:#fff}
}
</style>
</head>
<body>
<div id="viewport">
  <div id="scroller">
    <div id="stage">
      <canvas id="scene"></canvas>
      <div class="panelSnap p1"></div><div class="panelSnap p2"></div><div class="panelSnap p3"></div>
    </div>
  </div>
  <div class="controls"><button id="locBtn">◎ My location</button><button id="refreshBtn">↻</button></div>
  <div class="hud">
    <div class="card weather"><div class="place" id="place">Loading wind…</div><div class="speed"><span id="speed">--</span> <small style="font-size:13px;font-weight:500">km/h</small></div><div class="sub"><span id="dirText">--</span><span>Gust <b id="gust">--</b></span><span id="phase">--</span></div></div>
    <div class="card compass"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><div class="dial"><div class="arrow" id="arrow"></div><div class="centerDot"></div></div></div>
  </div>
  <div class="status" id="status">Live wind drives the field</div>
  <div class="dots"><i class="on"></i><i></i><i></i></div>
</div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),scroller=document.getElementById('scroller');
const speedEl=document.getElementById('speed'),gustEl=document.getElementById('gust'),dirEl=document.getElementById('dirText'),phaseEl=document.getElementById('phase'),placeEl=document.getElementById('place'),arrow=document.getElementById('arrow'),statusEl=document.getElementById('status');
let wind=12,gust=18,windDir=250,isDay=true,turbineAngle=0,last=performance.now(),particles=[],stars=[],kites=[],clouds=[];
let currentLat=3.1073,currentLon=101.6067,currentPlace='Petaling Jaya';
const DPR=()=>Math.min(devicePixelRatio||1,2);
function resize(){const r=stage.getBoundingClientRect(),d=DPR();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);seedScene(r.width,r.height)}
function seedScene(w,h){stars=Array.from({length:90},()=>({x:Math.random()*w,y:Math.random()*h*.62,r:.4+Math.random()*1.2,a:.3+Math.random()*.7}));clouds=Array.from({length:6},(_,i)=>({x:(i/6)*w+Math.random()*180,y:55+Math.random()*150,s:.7+Math.random()*1.2}));kites=[{x:.58,y:.28,c:'#ff5b67',p:0},{x:.72,y:.20,c:'#ffd54a',p:2.1},{x:.84,y:.32,c:'#4ad1c8',p:4.2}];particles=[]}
function compassName(deg){const n=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return n[Math.round((deg%360)/22.5)%16]}
function skyColors(){if(isDay)return ['#78bbed','#d9efff','#f5d6a1'];return ['#07111f','#142642','#263b55']}
function drawSky(w,h){const c=skyColors(),g=ctx.createLinearGradient(0,0,0,h*.72);g.addColorStop(0,c[0]);g.addColorStop(.65,c[1]);g.addColorStop(1,c[2]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(!isDay){ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#f7f1c9';ctx.beginPath();ctx.arc(w*.82,h*.15,28,0,Math.PI*2);ctx.fill();ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(w*.835,h*.14,27,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#fff7c4';ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(w*.84,h*.13,34,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function drawClouds(w,h,t){const drift=((windDir>180?1:-1)*Math.max(4,wind*.18));ctx.fillStyle=isDay?'#ffffffaa':'#c7d3df24';for(const c of clouds){let x=(c.x+t*drift*.003)%(w+300)-150, y=c.y;ctx.beginPath();ctx.ellipse(x,y,70*c.s,24*c.s,0,0,Math.PI*2);ctx.ellipse(x+45*c.s,y-10*c.s,45*c.s,28*c.s,0,0,Math.PI*2);ctx.ellipse(x-42*c.s,y-5*c.s,38*c.s,23*c.s,0,0,Math.PI*2);ctx.fill()}}
function drawField(w,h,t){const horizon=h*.61,g=ctx.createLinearGradient(0,horizon,0,h);g.addColorStop(0,isDay?'#6ca34d':'#233927');g.addColorStop(1,isDay?'#315f31':'#101e17');ctx.fillStyle=g;ctx.fillRect(0,horizon,w,h-horizon);ctx.fillStyle=isDay?'#527e3c':'#1b2c20';ctx.beginPath();ctx.moveTo(0,horizon+10);for(let x=0;x<=w;x+=60)ctx.lineTo(x,horizon-10-Math.sin(x*.01)*16);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();const bend=Math.sin((windDir/180)*Math.PI)*Math.min(12,wind*.35),amp=Math.min(18,2+wind*.34);ctx.strokeStyle=isDay?'#6fa653':'#34563a';ctx.lineWidth=1;for(let x=0;x<w;x+=8){let base=horizon+35+((x*19)%Math.max(50,h-horizon-45));let len=12+((x*7)%20);ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+bend*.4+Math.sin(t*.004+x)*amp*.12,base-len*.55,x+bend,base-len);ctx.stroke()}}
function drawTurbine(w,h,t){const cx=w*(innerWidth<=700?1/6:.16),ground=h*.78,hubY=h*.35,hubX=cx,scale=Math.min(w/(innerWidth<=700?900:1450),h/760);ctx.save();ctx.translate(hubX,hubY);ctx.fillStyle=isDay?'#e8edf0':'#aeb8c2';ctx.beginPath();ctx.moveTo(-12*scale,0);ctx.lineTo(-28*scale,(ground-hubY));ctx.lineTo(28*scale,(ground-hubY));ctx.lineTo(12*scale,0);ctx.closePath();ctx.fill();ctx.fillStyle=isDay?'#d9e0e4':'#929daa';ctx.fillRect(-10*scale,-9*scale,42*scale,18*scale);const rpm=Math.min(.055,.008+wind*.00115);turbineAngle+=rpm*(t-last);ctx.rotate(turbineAngle);for(let i=0;i<3;i++){ctx.save();ctx.rotate(i*Math.PI*2/3);ctx.fillStyle=isDay?'#f3f6f7':'#c7d0d7';ctx.beginPath();ctx.moveTo(0,-7*scale);ctx.quadraticCurveTo(95*scale,-18*scale,145*scale,-6*scale);ctx.quadraticCurveTo(85*scale,8*scale,8*scale,11*scale);ctx.closePath();ctx.fill();ctx.restore()}ctx.fillStyle='#c4ccd2';ctx.beginPath();ctx.arc(0,0,14*scale,0,Math.PI*2);ctx.fill();if(!isDay){ctx.fillStyle='#ff4c4c';ctx.beginPath();ctx.arc(22*scale,-12*scale,2.4*scale,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawPlayground(w,h){const sx=innerWidth<=700?w*.54:w*.61,ground=h*.73;ctx.strokeStyle=isDay?'#4b5962':'#63717c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,ground);ctx.lineTo(sx+34,ground-55);ctx.lineTo(sx+68,ground);ctx.moveTo(sx+17,ground-28);ctx.lineTo(sx+52,ground-28);ctx.stroke();ctx.fillStyle=isDay?'#d55f5f':'#744646';ctx.fillRect(sx+105,ground-28,65,8);ctx.fillStyle=isDay?'#8c674c':'#5a5048';ctx.fillRect(sx+112,ground-20,5,20);ctx.fillRect(sx+158,ground-20,5,20)}
function kiteCount(){if(!isDay||wind<4||wind>45)return 0;if(wind<10)return 1;if(wind<25)return 2;return 3}
function drawKites(w,h,t){const count=kiteCount(),dirSign=Math.sin(windDir*Math.PI/180)>=0?1:-1;for(let i=0;i<count;i++){const k=kites[i],baseX=w*k.x,baseY=h*k.y,bob=Math.sin(t*.0018+k.p)*12*(1+Math.min(wind,30)/30),sway=dirSign*Math.sin(t*.001+k.p)*Math.min(42,wind);const x=baseX+sway,y=baseY+bob;ctx.strokeStyle='#ffffff99';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+16);ctx.quadraticCurveTo(x-18*dirSign,y+70,w*(k.x-.04),h*.76);ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.002+k.p)*.12);ctx.fillStyle=k.c;ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(17,0);ctx.lineTo(0,20);ctx.lineTo(-17,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(0,20);ctx.moveTo(-17,0);ctx.lineTo(17,0);ctx.stroke();ctx.restore();ctx.strokeStyle=k.c;ctx.beginPath();for(let j=0;j<4;j++){const yy=y+22+j*10,xx=x-dirSign*(j*6)+Math.sin(t*.004+j)*4;ctx.lineTo(xx,yy)}ctx.stroke()}}
function drawNightParticles(w,h,t){if(isDay)return;const strength=Math.max(1,wind);if(particles.length<Math.min(55,10+strength*1.2)){particles.push({x:Math.random()*w,y:h*.2+Math.random()*h*.65,v:.5+Math.random()*1.5,r:Math.random()*6,a:Math.random()*6.28,fire:wind<6&&Math.random()>.35})}const sx=Math.sin(windDir*Math.PI/180),sy=-Math.cos(windDir*Math.PI/180);particles=particles.filter(p=>p.x>-80&&p.x<w+80&&p.y>-80&&p.y<h+80);for(const p of particles){p.x+=sx*strength*.035*p.v;p.y+=sy*strength*.015*p.v;p.a+=.04*p.v;if(p.fire){ctx.fillStyle='#eaff91';ctx.globalAlpha=.55+.35*Math.sin(t*.004+p.a);ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fill()}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='#876a42cc';ctx.globalAlpha=.8;ctx.fillRect(-4,-2,8,4);ctx.restore()}}ctx.globalAlpha=1}
function draw(t){const r=stage.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);drawSky(w,h);drawClouds(w,h,t);drawField(w,h,t);drawPlayground(w,h);drawTurbine(w,h,t);drawKites(w,h,t);drawNightParticles(w,h,t);last=t;requestAnimationFrame(draw)}
async function loadWind(lat=currentLat,lon=currentLon,label=currentPlace){currentLat=lat;currentLon=lon;currentPlace=label;placeEl.textContent=label;statusEl.textContent='Updating live wind…';try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&wind_speed_unit=kmh&timezone=auto`;const j=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Weather unavailable');return r.json()});wind=Number(j.current.wind_speed_10m)||0;gust=Number(j.current.wind_gusts_10m)||wind;windDir=Number(j.current.wind_direction_10m)||0;isDay=Number(j.current.is_day)===1;speedEl.textContent=Math.round(wind);gustEl.textContent=Math.round(gust)+' km/h';dirEl.textContent='From '+compassName(windDir);phaseEl.textContent=isDay?'Day':'Night';arrow.style.transform=`translate(-50%,-100%) rotate(${windDir}deg)`;document.querySelector('meta[name="theme-color"]').content=isDay?'#76b7e8':'#07111f';statusEl.textContent=`Wind from ${compassName(windDir)} · ${Math.round(windDir)}°`;seedScene(stage.clientWidth,stage.clientHeight)}catch(e){statusEl.textContent='Using demo wind · live data unavailable';placeEl.textContent=label+' · demo'}}
function useLocation(){if(!navigator.geolocation){statusEl.textContent='Location not available';return}statusEl.textContent='Requesting location…';navigator.geolocation.getCurrentPosition(p=>loadWind(p.coords.latitude,p.coords.longitude,'Your location'),()=>{statusEl.textContent='Location denied · using Petaling Jaya';loadWind(3.1073,101.6067,'Petaling Jaya')},{enableHighAccuracy:false,timeout:8000,maximumAge:600000})}
document.getElementById('locBtn').onclick=useLocation;document.getElementById('refreshBtn').onclick=()=>loadWind();
scroller.addEventListener('scroll',()=>{if(innerWidth>700)return;const i=Math.max(0,Math.min(2,Math.round(scroller.scrollLeft/innerWidth)));document.querySelectorAll('.dots i').forEach((d,n)=>d.classList.toggle('on',n===i))},{passive:true});
addEventListener('resize',resize);resize();requestAnimationFrame(draw);loadWind();setInterval(()=>loadWind(),10*60*1000);
</script>
</body>
</html>
